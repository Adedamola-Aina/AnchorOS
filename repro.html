<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottom Nav Repro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --safe-area-inset-bottom: 0px;
        }

        /* Mobile utility classes from index.css */
        .safe-area-bottom {
            padding-bottom: var(--safe-area-inset-bottom);
        }

        /* Bottom navigation safe area — respect home indicator only */
        .pb-safe-nav {
            padding-bottom: var(--safe-area-inset-bottom);
        }

        /* Mock specific device safe areas */
        body.iphone-se {
            --safe-area-inset-bottom: 0px;
            /* No notch/home indicator */
        }

        body.iphone-15-pro {
            --safe-area-inset-bottom: 34px;
            /* Home indicator area */
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col h-screen">
    <div class="flex-1 p-4">
        <h1 class="text-2xl font-bold mb-4">Content Area</h1>
        <p>This is the main content. The bottom nav should be fixed at the bottom.</p>
        <div class="mt-4 p-4 bg-white rounded shadow">
            <p>Scroll content...</p>
        </div>
    </div>

    <!-- 
      This is the BottomNavigation component structure from src/components/mobile/BottomNavigation.tsx 
      Replicating the exact classes used.
    -->
    <nav role="navigation" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40"
        aria-label="Mobile navigation">
        <!-- 
           THE BUG: 
           `h-12` (48px) fixes the height.
           `pb-safe-nav` adds padding-bottom (34px on iPhone X+).
           
           If box-sizing is border-box (default in Tailwind), padding is included in height.
           So 48px height MUST contain the content AND the 34px padding.
           That leaves only 14px for the icons and text!
        -->
        <div class="grid grid-cols-4 h-auto pb-safe-nav">
            <!-- Item 1 -->
            <a href="#"
                class="flex flex-col items-center justify-center gap-1 relative transition-colors duration-100 min-h-[44px] text-slate-400">
                <div class="w-5 h-5 bg-slate-400 rounded-full"></div>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <!-- Item 2 -->
            <a href="#"
                class="flex flex-col items-center justify-center gap-1 relative transition-colors duration-100 min-h-[44px] text-slate-400">
                <div class="w-5 h-5 bg-slate-400 rounded-full"></div>
                <span class="text-[10px] font-medium">Tasks</span>
            </a>
            <!-- Item 3 -->
            <a href="#"
                class="flex flex-col items-center justify-center gap-1 relative transition-colors duration-100 min-h-[44px] text-slate-400">
                <div class="w-5 h-5 bg-slate-400 rounded-full"></div>
                <span class="text-[10px] font-medium">Finance</span>
            </a>
            <!-- Item 4 -->
            <a href="#"
                class="flex flex-col items-center justify-center gap-1 relative transition-colors duration-100 min-h-[44px] text-slate-400">
                <div class="w-5 h-5 bg-slate-400 rounded-full"></div>
                <span class="text-[10px] font-medium">Settings</span>
            </a>
        </div>
    </nav>

    <script>
        // Simple switch to toggle device class for manual testing if needed
        const params = new URLSearchParams(window.location.search);
        if (params.get('device') === 'iphone-15-pro') {
            document.body.classList.add('iphone-15-pro');
            document.title += ' (iPhone 15 Pro)';
        } else {
            document.body.classList.add('iphone-se');
            document.title += ' (iPhone SE)';
        }
    </script>
</body>

</html>
