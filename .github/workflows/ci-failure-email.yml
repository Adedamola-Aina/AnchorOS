name: CI Failure Email Notifier

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch failing run logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "Fetching failing logs for ${HEAD_BRANCH}"
          bash ./tools/ci/fetch_failed_logs.sh "${REPO_OWNER}" "${REPO_NAME}" "${HEAD_BRANCH}" 1 || true

      - name: Upload collected logs
        uses: actions/upload-artifact@v7
        with:
          name: failing-ci-logs-${{ github.event.workflow_run.id }}
          path: ./ci-logs

      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI Failure: ${{ github.event.workflow_run.name }} (run #${{ github.event.workflow_run.run_number }})"
          body: |
            Repository: ${{ github.repository }}
            Workflow: ${{ github.event.workflow_run.name }}
            Conclusion: ${{ github.event.workflow_run.conclusion }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            Run URL: ${{ github.event.workflow_run.html_url }}
            Logs artifact: failing-ci-logs-${{ github.event.workflow_run.id }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
