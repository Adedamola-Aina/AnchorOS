name: Production Release

# Production release pipeline. Push to master OR explicit operator dispatch
# for an exact SHA. Gates: resolve SHA -> await CI success for that SHA ->
# classify surfaces vs the last SUCCESSFULLY deployed production SHA
# (fail closed with bootstrap_required when none exists) -> human approval
# via the `production` environment -> surface-aware guarded deploy ->
# release smoke -> GitHub Release. Never reruns CI validation here.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact master commit SHA to deploy (must be the current origin/master tip)'
        required: false
        type: string
      authorize_bootstrap:
        description: 'Explicit operator authorization for a FIRST deployment when no production baseline exists'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

env:
  NODE_VERSION: '22'


jobs:
  resolve-sha:
    name: 🔐 Resolve Requested SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve SHA
        id: resolve
        env:
          REQUESTED: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            git fetch origin master
            TIP=$(git rev-parse origin/master)
            if [ -z "$REQUESTED" ]; then
              echo "❌ Dispatch requires an exact master commit SHA."
              exit 1
            fi
            if [ "$REQUESTED" != "$TIP" ]; then
              echo "❌ Requested SHA $REQUESTED is not the current master tip ($TIP)."
              exit 1
            fi
            echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          fi

  await-validation:
    name: ⏳ Await CI Validation (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - name: Await successful CI run for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE=$(gh run list --repo "$REPO" --workflow ci.yml --json headSha,status,conclusion \
              --jq --arg sha "$SHA" '[.[] | select(.headSha == $sha)][0] | (if . == null then "none" else .status + ":" + (.conclusion // "pending") end)' \
              2>/dev/null || echo "none")
            echo "attempt ${i}: ${STATE}"
            case "$STATE" in
              completed:success)
                echo "✅ CI validation passed for ${SHA}"
                exit 0
                ;;
              completed:*)
                echo "❌ CI validation for ${SHA} did not pass: ${STATE}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "❌ Timed out awaiting CI validation for ${SHA}"
          exit 1

  # Job 0: Classify changed files (deterministic, repository-owned).
  # Engineering-only and CI-only master pushes must not trigger product
  # versioning/builds/deployments. Mixed or unknown changes fail safe to
  # the normal release pipeline.
  classify:
    name: 🔎 Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.classify.outputs.category }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            FILES=$(git diff --name-only "HEAD~1" HEAD || true)
          fi
          # Fail safe: if no diff can be determined, prefer release validation.
          if [ -z "$FILES" ]; then
            echo "Changed-file set undeterminable; failing safe to release pipeline."
            echo "category=PRODUCT_RUNTIME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/changed-files.txt
          node scripts/ci/classify-changes.js --files $(cat /tmp/changed-files.txt)

          # Run the classifier's own focused tests whenever CI infrastructure
          # (including the classifier) changes.
          if grep -q '^scripts/ci/' /tmp/changed-files.txt; then
            node --test scripts/ci/*.node-suite.mjs
          fi


  version-bump:
    name: 📦 Version Bump
    runs-on: ubuntu-latest
    needs: [await-validation, classify]
    if: >-
      !contains(github.event.head_commit.message, '[skip-version]') &&
      needs.classify.outputs.release == 'true'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: bump-type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" == *"!"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == feat:* ]] || [[ "$COMMIT_MSG" == *"feat("* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump
        run: |
          npm version ${{ steps.bump-type.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Git commits are source of truth (no CHANGELOG.md)
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip-version]" || echo "no changes to commit"
          git tag "v$NEW_VERSION" || echo "tag already exists"

      - name: Push version bump
        run: |
          git push origin master --follow-tags || echo "⚠️ Push failed — add CI_PAT secret (Settings → Secrets → Actions) with a PAT that has repo write access"


  # Job 4: Build for production (only on master branch)
  build-production:
    name: 🏗️ Build Production
    runs-on: ubuntu-latest
    needs: [await-validation, classify]
    if: needs.classify.outputs.release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write production env config
        run: printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}

      - name: Build for production
        run: npm run build:production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/


  # Job 4.5: Lighthouse CI (performance gates)
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build-production, classify]
    # Product-only performance gate: skipped when the product pipeline is
    # skipped for engineering-only/CI-only changes (needs propagation), and
    # skipped for BACKEND_RUNTIME-only changes: Functions/rules/indexes
    # deployments do not alter the served frontend, so a Lighthouse budget
    # gate is not meaningful (and must not block B1 backend rollouts).
    if: >
      needs.build-production.result == 'success' &&
      needs.classify.outputs.category != 'BACKEND_RUNTIME'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # LHCI's startServerCommand boots vite preview on 4173 itself;
      # pre-starting a second server collides on the port.
      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/


  # Job 5: Deploy to production. Requires explicit owner approval via the
  # GitHub `production` environment. Deploys ONLY surfaces classified as
  # changed since the last successful production deploy; never reruns CI
  # validation inside the deployment (CI validated this exact SHA).
  # Job 5: Deploy to production. Requires explicit owner approval via the
  # GitHub `production` environment. Deploys ONLY surfaces classified as
  # changed since the last successful production deploy; never reruns CI
  # validation inside the deployment (CI validated this exact SHA).
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-production, lighthouse, await-validation, classify]
    if: >
      !cancelled() &&
      needs.build-production.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment surfaces since last production deploy
        id: surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow production.yml || true)
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          if [ -z "$BASE" ]; then
            if [ "${{ inputs.authorize_bootstrap }}" != "true" ]; then
              echo "❌ bootstrap_required"
              echo "   No trustworthy previous production deployment SHA exists."
              echo "   An unknown baseline is NEVER treated as 'deploy everything'."
              echo "   An operator must explicitly dispatch this workflow with"
              echo "   authorize_bootstrap=true to invoke the authorized first-deployment plan."
              exit 1
            fi
            echo "⚠️ No baseline — operator EXPLICITLY authorized the bootstrap first-deployment plan."
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$(git rev-list --max-parents=0 HEAD)" --functions "$FN_ALLOW")
          else
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$BASE" --functions "$FN_ALLOW")
          fi
          echo "$RESULT"
          SURFACES=""
          if jq -e '.hosting == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}hosting,"; fi
          if jq -e '.rules == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}rules,"; fi
          if jq -e '.indexes == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}indexes,"; fi
          if jq -e '.functions == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}functions"; fi
          SURFACES="${SURFACES%,}"
          if [ -z "$SURFACES" ]; then
            echo "❌ Nothing to deploy to production (no changed surfaces since last deploy)."
            exit 1
          fi
          echo "prod_surfaces=$SURFACES" >> "$GITHUB_OUTPUT"
          echo "prod_functions=$(jq -r '.functionsToDeploy // "" | join(",")' <<< "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting')

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Write production env config
        run: |
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
          printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > functions/.env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (production, surface-aware)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: ${{ steps.surfaces.outputs.prod_surfaces }}
          FUNCTIONS: ${{ steps.surfaces.outputs.prod_functions }}
        run: |
          set -euo pipefail
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:production -- "${ARGS[@]}"

      - name: Post-deploy release smoke (deployed production)
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting') || contains(steps.surfaces.outputs.prod_surfaces, 'functions')
        env:
          E2E_BASE_URL: https://anchor-os.web.app
        run: npx playwright test --config config/playwright.release-smoke.config.ts

      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # The tag was pushed in the version-bump job. 
          # Now that production deploy succeeded, create the actual release.
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes \
            --notes "Production deployment of Anchor OS v$VERSION. See CHANGELOG.md for full commit history." || echo "Release already exists or failed to create"
