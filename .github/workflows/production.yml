name: Production Release
run-name: 'Production ${{ inputs.mode }} ${{ inputs.sha }}'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact master commit SHA to deploy (must be the current origin/master tip with successful CI)'
        required: true
        type: string
      mode:
        description: 'Deployment mode: normal (surface-aware) or b1 (rules first, then the five allowed Functions; no Hosting/indexes)'
        required: true
        type: choice
        default: 'normal'
        options:
          - normal
          - b1
      authorize_bootstrap:
        description: 'normal mode only: explicit operator authorization for a FIRST deployment when no normal production baseline exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Production release model (run-name carries mode + SHA for provenance):
#   0. MANUAL ONLY: no push trigger. Production is mutated exclusively by an
#      operator workflow_dispatch for an EXACT SHA. This workflow NEVER pushes,
#      commits, or version-bumps master.
#   1. resolve-sha: requested SHA must be the current origin/master tip.
#   2. await-validation: CI (ci.yml) must have succeeded for THAT EXACT SHA.
#   3. await-staging: a successful STAGING deployment of the SAME SHA in the
#      SAME mode must exist (run title "Staging <mode> <sha>").
#   4. mode=normal: surface-aware deploy classified against the last successful
#      *normal* production baseline (run names prefixed "Production normal").
#      No baseline -> FAIL CLOSED with bootstrap_required unless the operator
#      explicitly passed authorize_bootstrap=true. Lighthouse skipped for
#      backend-only changes.
#   5. mode=b1: Firestore rules deploy FIRST as a separate guarded invocation;
#      only after success are exactly the five allowed Functions deployed as a
#      SECOND invocation. No Hosting, no indexes, no version bump, no migration.
#   6. Every mutation job enters the `production` environment (human approval).
#   7. Normal baseline lookup ignores B1-mode runs (title-prefix filtering).

jobs:
  resolve-sha:
    name: 🔐 Resolve & Authorize Requested SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      mode: ${{ steps.auth.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested SHA is authorized master history
        id: auth
        env:
          REQUESTED: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          TIP=$(git rev-parse origin/master)
          if [ -z "$REQUESTED" ]; then
            echo "❌ No SHA supplied. Dispatch this workflow with the exact master commit SHA to deploy."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED" "$TIP"; then
            echo "❌ Requested SHA $REQUESTED is NOT part of master history. Refusing to deploy."
            exit 1
          fi
          if [ "$REQUESTED" != "$TIP" ]; then
            echo "❌ Requested SHA $REQUESTED is not the current master tip ($TIP)."
            exit 1
          fi
          if [ "$MODE" != "normal" ] && [ "$MODE" != "b1" ]; then
            echo "❌ Unknown mode '$MODE'. Allowed: normal, b1."
            exit 1
          fi
          echo "✅ Requested SHA $REQUESTED is the current master tip (mode: $MODE)."
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  await-validation:
    name: ⏳ Await CI Validation (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - name: Await successful CI run for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE=$(gh run list --repo "$REPO" --workflow ci.yml --json headSha,status,conclusion \
              --jq --arg sha "$SHA" '[.[] | select(.headSha == $sha)][0] | (if . == null then "none" else .status + ":" + (.conclusion // "pending") end)' \
              2>/dev/null || echo "none")
            echo "attempt ${i}: ${STATE}"
            case "$STATE" in
              completed:success)
                echo "✅ CI validation passed for ${SHA}"
                exit 0
                ;;
              completed:*)
                echo "❌ CI validation for ${SHA} did not pass: ${STATE}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "❌ Timed out awaiting CI validation for ${SHA}"
          exit 1

  await-staging:
    name: ⏳ Await Same-Mode Staging Success (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-validation]
    steps:
      - name: Verify successful same-mode staging deployment of this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
          MODE: ${{ needs.resolve-sha.outputs.mode }}
        run: |
          set -euo pipefail
          TITLE="Staging ${MODE} ${SHA}"
          HIT=$(gh run list --repo "$REPO" --workflow staging.yml --json displayTitle,headSha,conclusion \
            --jq --arg title "$TITLE" --arg sha "$SHA" \
            '[.[] | select(.displayTitle == $title and .headSha == $sha and .conclusion == "success")] | length' \
            2>/dev/null || echo 0)
          if [ "$HIT" -lt 1 ]; then
            echo "❌ No successful staging deployment recorded for this SHA in mode '${MODE}'."
            echo "   Required run title: '${TITLE}'."
            echo "   Production requires same-SHA, same-mode staging success before mutation."
            exit 1
          fi
          echo "✅ Staging ${MODE} deployment verified for ${SHA}."

  classify:
    name: 🔎 Classify Changed Files
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-staging]
    outputs:
      category: ${{ steps.classify.outputs.category }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          # Dispatch events carry no event.before; fail safe to release validation.
          FILES=$(git diff --name-only "${{ needs.resolve-sha.outputs.sha }}" HEAD || true)
          if [ -z "$FILES" ]; then
            echo "No delta between requested SHA and HEAD; treating as release-relevant."
            echo "category=PRODUCT_RUNTIME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/changed-files.txt
          node scripts/ci/classify-changes.js --files $(cat /tmp/changed-files.txt)

  build-production:
    name: 🏗️ Build Production (normal mode)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.release == 'true' && inputs.mode == 'normal'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write production env config
        run: printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
      - name: Build for production
        run: npm run build:production
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/

  lighthouse:
    name: 🔦 Lighthouse CI (normal mode)
    runs-on: ubuntu-latest
    needs: [build-production, classify]
    # Product-only performance gate, normal mode only. Skipped for
    # BACKEND_RUNTIME-only changes: Functions/rules deployments do not alter
    # the served frontend, so a Lighthouse budget gate must not block B1.
    if: >
      inputs.mode == 'normal' &&
      needs.build-production.result == 'success' &&
      needs.classify.outputs.category != 'BACKEND_RUNTIME'
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  deploy-production:
    name: 🚀 Deploy to Production (normal)
    runs-on: ubuntu-latest
    needs: [classify, build-production, lighthouse]
    if: >-
      !cancelled() &&
      inputs.mode == 'normal' &&
      needs.classify.outputs.release == 'true' &&
      needs.build-production.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment surfaces since last NORMAL production deploy
        id: surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow production.yml --title-prefix "Production normal" || true)
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          if [ -z "$BASE" ]; then
            if [ "${{ inputs.authorize_bootstrap }}" != "true" ]; then
              echo "❌ bootstrap_required"
              echo "   No trustworthy previous NORMAL production deployment SHA exists."
              echo "   An unknown baseline is NEVER treated as 'deploy everything'."
              echo "   An operator must explicitly dispatch this workflow with"
              echo "   authorize_bootstrap=true to invoke the authorized first-deployment plan."
              exit 1
            fi
            echo "⚠️ No baseline — operator EXPLICITLY authorized the bootstrap first deployment."
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$(git rev-list --max-parents=0 HEAD)" --functions "$FN_ALLOW")
          else
            echo "Last successfully deployed NORMAL production SHA: $BASE"
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$BASE" --functions "$FN_ALLOW")
          fi
          echo "$RESULT"
          SURFACES=""
          if jq -e '.hosting == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}hosting,"; fi
          if jq -e '.rules == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}rules,"; fi
          if jq -e '.indexes == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}indexes,"; fi
          if jq -e '.functions == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}functions"; fi
          SURFACES="${SURFACES%,}"
          if [ -z "$SURFACES" ]; then
            echo "❌ Nothing to deploy to production (no changed surfaces since last deploy)."
            exit 1
          fi
          echo "prod_surfaces=$SURFACES" >> "$GITHUB_OUTPUT"
          echo "prod_functions=$(jq -r '.functionsToDeploy // "" | join(",")' <<< "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting')

      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - name: Write production env config
        run: |
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
          printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > functions/.env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (production, surface-aware)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: ${{ steps.surfaces.outputs.prod_surfaces }}
          FUNCTIONS: ${{ steps.surfaces.outputs.prod_functions }}
        run: |
          set -euo pipefail
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:production -- "${ARGS[@]}"

      - name: Post-deploy release smoke (deployed production)
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting') || contains(steps.surfaces.outputs.prod_surfaces, 'functions')
        env:
          E2E_BASE_URL: https://anchor-os.web.app
        run: npx playwright test --config config/playwright.release-smoke.config.ts

      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  deploy-b1-rules:
    name: 🛡️ B1 Step A — Deploy Firestore Rules to Production (FIRST)
    runs-on: ubuntu-latest
    needs: [await-staging]
    if: inputs.mode == 'b1'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Firestore rules ONLY (containment first)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npm run deploy:production -- --yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces=rules

  deploy-b1-functions:
    name: 🔗 B1 Step B — Deploy the five B1 Functions to Production (only after rules succeed)
    runs-on: ubuntu-latest
    needs: [deploy-b1-rules]
    if: >-
      !cancelled() &&
      inputs.mode == 'b1' &&
      needs.deploy-b1-rules.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Write production functions env config
        run: printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > functions/.env.production
        env:
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy exactly the five B1 Functions (second invocation)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FN_ALLOW: "disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
        run: |
          set -euo pipefail
          npm run deploy:production -- --yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces=functions --functions="$FN_ALLOW"

      - name: Post-deploy release smoke (deployed production)
        env:
          E2E_BASE_URL: https://anchor-os.web.app
        run: npx playwright test --config config/playwright.release-smoke.config.ts

      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-b1-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
