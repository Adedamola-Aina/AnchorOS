name: Production Release
run-name: 'Production ${{ inputs.mode }} ${{ inputs.sha }}'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact master commit SHA to deploy (must be the current origin/master tip with successful CI)'
        required: true
        type: string
      mode:
        description: 'Deployment mode: normal (surface-aware) or b1 (rules first, then the five allowed Functions; no Hosting/indexes)'
        required: true
        type: choice
        default: 'normal'
        options:
          - normal
          - b1
      authorize_bootstrap:
        description: 'normal mode only: explicit operator authorization for a FIRST deployment when no normal production baseline exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Production release model (run-name carries mode + SHA for provenance):
#   0. MANUAL ONLY: no push trigger, and dispatch is rejected unless the
#      workflow ref is refs/heads/master. This workflow NEVER pushes, commits,
#      or version-bumps master (no version-bump job exists; release metadata
#      such as tags/GitHub Releases is a separate later non-blocking concern).
#   1. resolve-sha: requested SHA must be the current origin/master tip.
#   2. await-validation: CI (ci.yml) must have succeeded for THAT EXACT SHA.
#   3. await-staging: a successful STAGING deployment of the SAME SHA in the
#      SAME mode must exist (run title "Staging <mode> <sha>").
#   4. plan: mode-aware. normal = surfaces classified from the last successful
#      *normal* production baseline (run titles "Production normal"; B1 runs
#      excluded via --title-prefix). No baseline -> FAIL CLOSED with
#      bootstrap_required unless authorize_bootstrap=true, which runs the
#      explicit FIRST NORMAL deployment plan (all four surfaces, unfiltered
#      Functions surface). b1 = rules + exactly the five allowed Functions.
#   5. Build/Lighthouse only when the Hosting surface deploys; backend-only
#      normal releases build nothing and run no Lighthouse.
#   6. Every mutation job enters the `production` environment (human approval).
#   7. All build/plan/mutate jobs check out the authorized exact SHA explicitly.

jobs:
  resolve-sha:
    name: 🔐 Resolve & Authorize Requested SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      mode: ${{ steps.auth.outputs.mode }}
    steps:
      - name: Reject non-master workflow refs
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Dispatch rejected: this workflow may only run from refs/heads/master (got ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested SHA is authorized master history
        id: auth
        env:
          REQUESTED: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          TIP=$(git rev-parse origin/master)
          if [ -z "$REQUESTED" ]; then
            echo "❌ No SHA supplied. Dispatch this workflow with the exact master commit SHA to deploy."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED" "$TIP"; then
            echo "❌ Requested SHA $REQUESTED is NOT part of master history. Refusing to deploy."
            exit 1
          fi
          if [ "$REQUESTED" != "$TIP" ]; then
            echo "❌ Requested SHA $REQUESTED is not the current master tip ($TIP)."
            exit 1
          fi
          if [ "$MODE" != "normal" ] && [ "$MODE" != "b1" ]; then
            echo "❌ Unknown mode '$MODE'. Allowed: normal, b1."
            exit 1
          fi
          echo "✅ Requested SHA $REQUESTED is the current master tip (mode: $MODE)."
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  await-validation:
    name: ⏳ Await CI Validation (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - name: Await successful CI run for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # Release provenance lookup: `gh run list` emits JSON and the real
            # `jq` binary extracts the state for the EXACT SHA. gh's --jq flag
            # cannot take jq --arg parameters — passing them that way failed
            # silently and every lookup became "none". Lookup errors are NOT
            # suppressed: a real gh/jq failure fails this gate visibly.
            STATE=$(gh run list --repo "$REPO" --workflow ci.yml --json headSha,status,conclusion --limit 100 \
              | jq -r --arg sha "$SHA" '[.[] | select(.headSha == $sha)][0] | (if . == null then "none" else .status + ":" + (.conclusion // "pending") end)')
            echo "attempt ${i}: ${STATE}"
            case "$STATE" in
              completed:success)
                echo "✅ CI validation passed for ${SHA}"
                exit 0
                ;;
              completed:*)
                echo "❌ CI validation for ${SHA} did not pass: ${STATE}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "❌ Timed out awaiting CI validation for ${SHA}"
          exit 1

  await-staging:
    name: ⏳ Await Same-Mode Staging Success (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-validation]
    steps:
      - name: Verify successful same-mode staging deployment of this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
          MODE: ${{ needs.resolve-sha.outputs.mode }}
        run: |
          set -euo pipefail
          TITLE="Staging ${MODE} ${SHA}"
          # Release provenance lookup (same-SHA, same-mode staging success):
          # `gh run list` emits JSON and the real `jq` binary matches on title,
          # SHA and conclusion. No gh --jq/--arg misuse; lookup errors are NOT
          # suppressed into 0 — a real gh/jq failure fails this gate visibly.
          HIT=$(gh run list --repo "$REPO" --workflow staging.yml --json displayTitle,headSha,conclusion --limit 100 \
            | jq -r --arg title "$TITLE" --arg sha "$SHA" \
              '[.[] | select(.displayTitle == $title and .headSha == $sha and .conclusion == "success")] | length')
          if [ "$HIT" -lt 1 ]; then
            echo "❌ No successful staging deployment recorded for this SHA in mode '${MODE}'."
            echo "   Required run title: '${TITLE}'."
            echo "   Production requires same-SHA, same-mode staging success before mutation."
            exit 1
          fi
          echo "✅ Staging ${MODE} deployment verified for ${SHA}."

  plan:
    name: 🧭 Plan Deployment (mode-aware)
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-staging]
    outputs:
      sha: ${{ needs.resolve-sha.outputs.sha }}
      mode: ${{ steps.base.outputs.mode }}
      deploy_hosting: ${{ steps.plan.outputs.deploy_hosting }}
      deploy_rules: ${{ steps.plan.outputs.deploy_rules }}
      deploy_indexes: ${{ steps.plan.outputs.deploy_indexes }}
      deploy_functions: ${{ steps.plan.outputs.deploy_functions }}
      functions_to_deploy: ${{ steps.plan.outputs.functions_to_deploy }}
      ci_only: ${{ steps.plan.outputs.ci_only }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          fetch-depth: 0

      - name: Resolve normal baseline (fail closed) / B1 requires none
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.resolve-sha.outputs.mode }}
          AUTHORIZE: ${{ inputs.authorize_bootstrap }}
        run: |
          set -euo pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" == "b1" ]; then
            echo "B1 mode: no production baseline required — this is a partial phased rollout."
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normal mode: only successful NORMAL runs count as the whole-SHA baseline.
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow production.yml --title-prefix "Production normal" || true)
          if [ -z "$BASE" ]; then
            if [ "$AUTHORIZE" != "true" ]; then
              echo "❌ bootstrap_required"
              echo "   No trustworthy previous NORMAL production deployment exists."
              echo "   An unknown baseline is NEVER treated as 'deploy everything',"
              echo "   and a production release never mutates master."
              echo "   An operator must explicitly re-dispatch with authorize_bootstrap=true"
              echo "   for the authorized FIRST NORMAL production deployment."
              exit 1
            fi
            echo "⚠️ No baseline — operator EXPLICITLY authorized the FIRST NORMAL production deployment."
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "Last successfully deployed NORMAL production SHA: $BASE"
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute deployment plan
        id: plan
        env:
          MODE: ${{ needs.resolve-sha.outputs.mode }}
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          # B1-mode-only allow-list: exactly these Functions, nothing else.
          # mode=normal NEVER passes this filter to the classifier — an empty
          # functions filter means the NORMAL Functions surface.
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          echo "fn_allow=$FN_ALLOW" >> "$GITHUB_OUTPUT"
          if [ "$MODE" == "b1" ]; then
            echo "B1 plan: rules surface only first; Functions second; NEVER Hosting/indexes."
            echo "deploy_hosting=false"    >> "$GITHUB_OUTPUT"
            echo "deploy_rules=true"      >> "$GITHUB_OUTPUT"
            echo "deploy_indexes=false"   >> "$GITHUB_OUTPUT"
            echo "deploy_functions=true"  >> "$GITHUB_OUTPUT"
            echo "functions_to_deploy=$FN_ALLOW" >> "$GITHUB_OUTPUT"
            echo "ci_only=false"          >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ]; then
            # Explicitly authorized FIRST NORMAL production deployment:
            # whole-environment baseline, unfiltered Functions surface.
            echo "Authorized normal bootstrap plan: full environment."
            echo "deploy_hosting=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_rules=true"      >> "$GITHUB_OUTPUT"
            echo "deploy_indexes=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_functions=true"  >> "$GITHUB_OUTPUT"
            echo "functions_to_deploy="    >> "$GITHUB_OUTPUT"
            echo "ci_only=false"          >> "$GITHUB_OUTPUT"
          else
            # Normal mode: classify surfaces from the normal baseline
            # WITHOUT the B1 Functions allow-list.
            node scripts/ci/deploy-surface-classifier.js --from "$BASE"
          fi

  build-production:
    name: 🏗️ Build Production (normal mode, Hosting surface only)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.mode == 'normal' && needs.plan.outputs.ci_only != 'true' && needs.plan.outputs.deploy_hosting == 'true'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write production env config
        run: printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
      - name: Build for production
        run: npm run build:production
      - uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/

  lighthouse:
    name: 🔦 Lighthouse CI (normal mode, Hosting surface only)
    runs-on: ubuntu-latest
    needs: [plan, build-production]
    if: >-
      needs.plan.outputs.mode == 'normal' &&
      needs.plan.outputs.deploy_hosting == 'true' &&
      needs.build-production.result == 'success'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # The audit uses the production hosting artifact — the exact bundle users download,
      # pointed at the real backend — and signs in with a dedicated production canary.
      # A cloud release path must never run local emulators or a local fixture identity.
      #
      # Why a session is required at all: the budgets are per *screen*, and every budgeted
      # route is authenticated (/settings, /dashboard, /finance, /commitments, /fabric).
      # Auditing with no session measured the boot splash on every route (LCP/TTI ~9.0s,
      # identical across routes and samples), so "/settings <= 2800ms" was asserted against
      # a page that was never /settings. The gate had never passed on any commit.
      - name: Download the production hosting artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist
      - name: Require the production canary credentials
        # Fail closed and early, with the reason, rather than deep inside the audit.
        env:
          CANARY_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          CANARY_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: |
          if [ -z "$CANARY_EMAIL" ] || [ -z "$CANARY_PASSWORD" ]; then
            echo "::error::PRODUCTION_SMOKE_EMAIL / PRODUCTION_SMOKE_PASSWORD are not configured."
            echo "The performance budget audits authenticated screens, so it must sign in."
            echo "Add a dedicated production canary account and store its credentials as these"
            echo "repository secrets (the same pair the post-deploy smoke uses)."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run Lighthouse CI (signed in as the production canary, against the real screens)
        run: npm run lighthouse
        env:
          LIGHTHOUSE_USE_PREBUILT: '1'
          LIGHTHOUSE_CANARY_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          LIGHTHOUSE_CANARY_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  deploy-production:
    name: 🚀 Deploy to Production (normal)
    runs-on: ubuntu-latest
    needs: [plan, build-production, lighthouse]
    if: >-
      !cancelled() &&
      needs.plan.outputs.mode == 'normal' &&
      needs.plan.outputs.ci_only != 'true' &&
      needs.plan.result == 'success' &&
      (needs.build-production.result == 'success' || needs.build-production.result == 'skipped') &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    environment: production
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
        if: needs.plan.outputs.deploy_hosting == 'true'
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Write production env config
        run: |
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
          printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > "$(node scripts/ci/functions-env-file.js --env production)"
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy selected normal surfaces via guarded pipeline
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: "${{ needs.plan.outputs.deploy_hosting == 'true' && 'hosting,' || '' }}${{ needs.plan.outputs.deploy_rules == 'true' && 'rules,' || '' }}${{ needs.plan.outputs.deploy_indexes == 'true' && 'indexes,' || '' }}${{ needs.plan.outputs.deploy_functions == 'true' && 'functions' || '' }}"
          FUNCTIONS: ${{ needs.plan.outputs.functions_to_deploy }}
        run: |
          set -euo pipefail
          SURFACES="${SURFACES%,}"
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:production -- "${ARGS[@]}"
      - name: Install Playwright Chromium (bounded smoke only)
        run: npx playwright install chromium --with-deps
      - name: Post-deploy release smoke (deployed production, dedicated canary)
        if: needs.plan.outputs.deploy_hosting == 'true' || needs.plan.outputs.deploy_functions == 'true'
        # Deployed smoke FAILS CLOSED without the production canary secrets
        # (scripts/ci/release-identity.mjs). The repository fixture identity is
        # never used against a cloud project.
        env:
          E2E_BASE_URL: https://anchor-os.web.app
          E2E_SMOKE_TARGET: production
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: npx playwright test --config config/playwright.release-smoke.config.ts
      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  deploy-b1:
    name: 🛡️ B1 Phased Production Deployment — rules FIRST, then the five Functions (ONE approval-gated mutation job)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.mode == 'b1'
    environment: production
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup dependencies (once)
        run: npm ci
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Write BOTH production env configs (app + Functions)
        run: |
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
          printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > "$(node scripts/ci/functions-env-file.js --env production)"
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 'B1 Step A: deploy Firestore rules ONLY to production (containment first)'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npm run deploy:production -- \
            --yes \
            --skip-tests \
            --skip-lint \
            --skip-audit \
            --skip-e2e \
            --skip-mutation \
            --skip-version-bump \
            --no-deploy-marker \
            --surfaces=rules

      - name: 'B1 Step B: deploy exactly the five B1 Functions to production (only after rules succeed)'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FN_ALLOW: "disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
        run: |
          set -euo pipefail
          npm run deploy:production -- \
            --yes \
            --skip-tests \
            --skip-lint \
            --skip-audit \
            --skip-e2e \
            --skip-mutation \
            --skip-version-bump \
            --no-deploy-marker \
            --surfaces=functions \
            --functions="$FN_ALLOW"

      - name: Install Playwright Chromium (bounded smoke only)
        run: npx playwright install chromium --with-deps
      - name: Post-deploy release smoke (deployed production, dedicated canary)
        # Deployed smoke FAILS CLOSED without the production canary secrets
        # (scripts/ci/release-identity.mjs). The repository fixture identity is
        # never used against a cloud project.
        env:
          E2E_BASE_URL: https://anchor-os.web.app
          E2E_SMOKE_TARGET: production
          PRODUCTION_SMOKE_EMAIL: ${{ secrets.PRODUCTION_SMOKE_EMAIL }}
          PRODUCTION_SMOKE_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_PASSWORD }}
        run: npx playwright test --config config/playwright.release-smoke.config.ts

      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-b1-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14
