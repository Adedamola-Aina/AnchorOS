name: Merge Gate
on:
  pull_request:
    branches: [master, staging]

jobs:
  lint-types:
    name: Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p config/tsconfig.app.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run test -- --run

  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cd functions && npm ci && npm audit --audit-level=high

  smoke-e2e:
    name: Smoke E2E
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --project=smoke
        env:
          E2E_BASE_URL: http://localhost:5173
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-e2e-report
          path: playwright-report/
          retention-days: 7

  mutation-tests:
    name: Mutation Tests (Finance/Security)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .stryker-tmp
          key: ${{ runner.os }}-stryker-${{ github.base_ref }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-stryker-${{ github.base_ref }}-
            ${{ runner.os }}-stryker-
      - run: npm run test:mutation:ci
