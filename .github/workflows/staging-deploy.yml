name: Staging Deploy
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact master commit SHA to deploy (must be the current origin/master tip with successful CI)'
        required: true
        type: string
      authorize_bootstrap:
        description: 'Explicit operator authorization for a FIRST deployment when no verified baseline exists (CI-gated, full surfaces)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Release-infra contract (staging authorization model):
#   0. MERGING/PUSHING TO MASTER NEVER MUTATES STAGING BY ITSELF. Staging is
#      mutated only by an explicit operator workflow_dispatch for an EXACT SHA.
#   1. resolve-sha verifies the requested SHA belongs to master history and is
#      the current origin/master tip (keeps deployment provenance exact).
#   2. await-validation blocks until the CI/CD Pipeline run for THAT EXACT SHA
#      has completed successfully — an unvalidated commit can never deploy.
#   3. classify computes changed deployment surfaces since the last
#      SUCCESSFULLY DEPLOYED staging SHA (never HEAD~1). If no trustworthy
#      baseline exists the workflow FAILS CLOSED with `bootstrap_required`;
#      unknown baselines never mean "deploy everything". A first deployment
#      requires the operator to explicitly pass authorize_bootstrap=true.
#   4. deploy passes validated-SHA skip flags to the guarded pipeline (no
#      lint/audit/tests/version-bump/E2E rerun inside deployment) and is
#      surface-aware. B1 ordered rollout: rules first, then only the five
#      allowed functions (never "all functions" during the B1 window).
#   5. release-smoke is the fast fail-fast post-deploy gate against the
#      deployed staging URL (retries 0, 20s tests, 3-minute bound, chromium).
#   6. Deployment provenance = this workflow run (a successful run IS the
#      record of the deployed SHA), consumed by scripts/ci/last-deployed-sha.js.

jobs:
  resolve-sha:
    name: 🔐 Resolve & Authorize Requested SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested SHA is authorized master history
        id: auth
        env:
          REQUESTED: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          TIP=$(git rev-parse origin/master)
          if [ -z "$REQUESTED" ]; then
            echo "❌ No SHA supplied. Dispatch this workflow with the exact master commit SHA to deploy."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED" "$TIP"; then
            echo "❌ Requested SHA $REQUESTED is NOT part of master history. Refusing to deploy."
            exit 1
          fi
          if [ "$REQUESTED" != "$TIP" ]; then
            echo "❌ Requested SHA $REQUESTED is not the current master tip ($TIP)."
            echo "   Only the current master tip can be deployed to staging (keeps provenance exact)."
            exit 1
          fi
          echo "✅ Requested SHA $REQUESTED is the current master tip."
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"

  await-validation:
    name: ⏳ Await CI Validation (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - name: Await successful CI/CD Pipeline run for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATE=$(gh run list --repo "$REPO" --workflow ci-cd.yml --json headSha,status,conclusion \
              --jq --arg sha "$SHA" '[.[] | select(.headSha == $sha)][0] | (if . == null then "none" else .status + ":" + (.conclusion // "pending") end)' \
              2>/dev/null || echo "none")
            echo "attempt ${i}: ${STATE}"
            case "$STATE" in
              completed:success)
                echo "✅ CI validation passed for ${SHA}"
                exit 0
                ;;
              completed:*)
                echo "❌ CI validation for ${SHA} did not pass: ${STATE}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "❌ Timed out awaiting CI validation for ${SHA}"
          exit 1

  classify:
    name: 🔎 Classify Deployment Surfaces
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-validation]
    outputs:
      deploy_hosting: ${{ steps.surfaces.outputs.deploy_hosting }}
      deploy_rules: ${{ steps.surfaces.outputs.deploy_rules }}
      deploy_indexes: ${{ steps.surfaces.outputs.deploy_indexes }}
      deploy_functions: ${{ steps.surfaces.outputs.deploy_functions }}
      functions_to_deploy: ${{ steps.surfaces.outputs.functions_to_deploy }}
      ci_only: ${{ steps.surfaces.outputs.ci_only }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last successfully deployed staging SHA (fail closed)
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow staging-deploy.yml || true)
          if [ -z "$BASE" ]; then
            if [ "${{ inputs.authorize_bootstrap }}" != "true" ]; then
              echo "❌ bootstrap_required"
              echo "   No trustworthy previous staging deployment SHA exists."
              echo "   An unknown baseline is NEVER treated as 'deploy everything',"
              echo "   and merging to master never mutates staging by itself."
              echo "   An operator must either establish a verified baseline (a previous"
              echo "   successful staging deploy) or explicitly re-dispatch this workflow"
              echo "   with authorize_bootstrap=true to invoke the authorized"
              echo "   first-deployment plan (CI-verified SHA, full surfaces, release-smoke gated)."
              exit 1
            fi
            echo "⚠️ No baseline — operator EXPLICITLY authorized the bootstrap first-deployment plan."
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "Last successfully deployed staging SHA: $BASE"
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify deployment surfaces since base
        id: surfaces
        run: |
          set -euo pipefail
          BASE="${{ steps.base.outputs.base_sha }}"
          BOOTSTRAP="${{ steps.base.outputs.bootstrap }}"
          # B1 ordered rollout: only these Functions may be deployed until the
          # rollout is complete (Step A: rules, Step B: these functions).
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          if [ "$BOOTSTRAP" == "true" ]; then
            # Explicitly authorized bootstrap: CI-verified SHA, full surfaces,
            # still guarded by the pipeline and release smoke. Functions stay
            # bounded by the B1 allow-list (never "all functions").
            echo "deploy_hosting=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_rules=true"      >> "$GITHUB_OUTPUT"
            echo "deploy_indexes=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_functions=true"  >> "$GITHUB_OUTPUT"
            echo "functions_to_deploy=$FN_ALLOW" >> "$GITHUB_OUTPUT"
            echo "ci_only=false"          >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/deploy-surface-classifier.js --from "$BASE" --functions "$FN_ALLOW"
          fi

  build-hosting:
    name: 🏗️ Build Staging Hosting (once)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.ci_only != 'true' && needs.classify.outputs.deploy_hosting == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write staging frontend env config
        run: printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
      - run: npm run build:staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-dist
          path: dist/

  deploy:
    name: 🚀 Deploy Changed Surfaces to Staging
    runs-on: ubuntu-latest
    needs: [classify, build-hosting]
    if: >
      !cancelled() &&
      needs.classify.outputs.ci_only != 'true' &&
      needs.classify.result == 'success' &&
      (needs.build-hosting.result == 'success' || needs.build-hosting.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Write staging env config
        run: |
          printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
          printf '%s\n' "$STAGING_FUNCTIONS_ENV" > functions/.env.staging
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
          STAGING_FUNCTIONS_ENV: ${{ secrets.STAGING_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy validated surfaces
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: "${{ needs.classify.outputs.deploy_hosting == 'true' && 'hosting,' || '' }}${{ needs.classify.outputs.deploy_rules == 'true' && 'rules,' || '' }}${{ needs.classify.outputs.deploy_indexes == 'true' && 'indexes,' || '' }}${{ needs.classify.outputs.deploy_functions == 'true' && 'functions' || '' }}"
          FUNCTIONS: ${{ needs.classify.outputs.functions_to_deploy }}
        run: |
          set -euo pipefail
          SURFACES="${SURFACES%,}"
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:staging -- "${ARGS[@]}"

  release-smoke:
    name: 🎯 Release Smoke (deployed staging)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: "!cancelled() && needs.deploy.result == 'success'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run release smoke against deployed staging
        run: npx playwright test --config config/playwright.release-smoke.config.ts
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  post-deploy-e2e:
    name: Post-Deploy E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: [release-smoke]
    if: needs.release-smoke.result == 'success'
    continue-on-error: true
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write E2E env config
        run: printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config config/playwright.config.ts --shard=${{ matrix.shard }}/4
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
