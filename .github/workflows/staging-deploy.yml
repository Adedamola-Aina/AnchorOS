name: Staging Deploy
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build:staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-dist
          path: dist/

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: staging-dist, path: dist/ }
      - run: npm install -g firebase-tools
      - run: npm run deploy:staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  post-deploy-e2e:
    name: Post-Deploy E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: [deploy]
    continue-on-error: true
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write E2E env config
        run: printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config config/playwright.config.ts --shard=${{ matrix.shard }}/4
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
