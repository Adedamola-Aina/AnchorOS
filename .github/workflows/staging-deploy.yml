name: Staging Deploy
on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Deterministic change classification: engineering-only and CI-only master
  # pushes must not deploy the AnchorOS product to staging. Mixed or unknown
  # changes fail safe to the normal staging deployment.
  classify:
    name: 🔎 Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            FILES=$(git diff --name-only "HEAD~1" HEAD || true)
          fi
          if [ -z "$FILES" ]; then
            echo "Changed-file set undeterminable; failing safe to staging deployment."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci/classify-changes.js --files $FILES

  build:
    name: Build Staging
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build:staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-dist
          path: dist/

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: staging-dist, path: dist/ }
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Write staging env config
        run: |
          printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
          printf '%s\n' "$STAGING_FUNCTIONS_ENV" > functions/.env.staging
          printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
          STAGING_FUNCTIONS_ENV: ${{ secrets.STAGING_FUNCTIONS_ENV }}
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}
      - run: npm install -g firebase-tools
      - run: npm run deploy:staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  post-deploy-e2e:
    name: Post-Deploy E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    continue-on-error: true
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write E2E env config
        run: printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config config/playwright.config.ts --shard=${{ matrix.shard }}/4
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
