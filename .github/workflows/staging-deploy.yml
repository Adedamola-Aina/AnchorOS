name: Staging Deploy
on:
  push:
    branches: [master]

jobs:
  build:
    name: Build Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build:staging
      - uses: actions/upload-artifact@v4
        with:
          name: staging-dist
          path: dist/

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: staging-dist, path: dist/ }
      - run: npm install -g firebase-tools
      - run: npm run deploy:staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  post-deploy-e2e:
    name: Post-Deploy E2E (non-blocking)
    runs-on: ubuntu-latest
    needs: [deploy]
    continue-on-error: true   # ← CRITICAL: staging is already live, E2E results are informational
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
