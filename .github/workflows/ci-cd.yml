# CI/CD Pipeline - Runs tests and deploys to staging
name: CI/CD Pipeline

on:
  push:
    branches: [master, staging, develop]
  pull_request:
    branches: [master, staging]

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

env:
  NODE_VERSION: '22'

jobs:
  # Job 0: Classify changed files (deterministic, repository-owned).
  # Engineering-only and CI-only master pushes must not trigger product
  # versioning/builds/deployments. Mixed or unknown changes fail safe to
  # the normal release pipeline.
  classify:
    name: 🔎 Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.classify.outputs.category }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            FILES=$(git diff --name-only "HEAD~1" HEAD || true)
          fi
          # Fail safe: if no diff can be determined, prefer release validation.
          if [ -z "$FILES" ]; then
            echo "Changed-file set undeterminable; failing safe to release pipeline."
            echo "category=PRODUCT_RUNTIME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/changed-files.txt
          node scripts/ci/classify-changes.js --files $(cat /tmp/changed-files.txt)

          # Run the classifier's own focused tests whenever CI infrastructure
          # (including the classifier) changes.
          if grep -q '^scripts/ci/' /tmp/changed-files.txt; then
            node --test scripts/ci/*.node-suite.mjs
          fi

  governance-gates:
    name: 🛡️ PR Governance Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR template governance sections
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('Not a pull request event. Skipping governance gate.');
              return;
            }

            const body = pr.body || '';
            const marker = '<!-- governance-gate-feedback -->';
            const requiredHeadings = [
              'Risk Class',
              'Success Metric',
              'Guardrail Metrics',
              'Rollout Plan',
              'Rollback Plan',
              'Observability',
              'Test-to-Risk Mapping'
            ];

            function getSectionContent(heading) {
              const sectionRegex = new RegExp(`###\\s+${heading}\\s*([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = body.match(sectionRegex);
              if (!match) return '';

              return match[1]
                .replace(/<!--([\s\S]*?)-->/g, '')
                .replace(/\r/g, '')
                .trim();
            }

            const missingHeadings = requiredHeadings.filter((heading) => {
              const headingRegex = new RegExp(`^###\\s+${heading}\\s*$`, 'im');
              return !headingRegex.test(body);
            });

            function hasMeaningfulContent(heading) {
              const content = getSectionContent(heading);
              if (!content) return false;

              if (content.length < 12) return false;
              if (/^(tbd|todo|n\/?a|none)$/i.test(content)) return false;
              return true;
            }

            const emptySections = requiredHeadings.filter((heading) => !hasMeaningfulContent(heading));

            const requiredChecks = [
              'I defined success + guardrail metrics',
              'I defined rollout + rollback plan',
              'I mapped tests to risk/failure modes'
            ];

            const unchecked = requiredChecks.filter((item) => {
              const checkedRegex = new RegExp(`-\\s*\\[x\\]\\s*${item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
              return !checkedRegex.test(body);
            });

            const errors = [];
            if (missingHeadings.length) errors.push(`Missing headings: ${missingHeadings.join(', ')}`);
            if (emptySections.length) errors.push(`Sections need meaningful content: ${emptySections.join(', ')}`);
            if (unchecked.length) errors.push(`Required checklist items must be checked: ${unchecked.join(', ')}`);

            const riskClassContent = getSectionContent('Risk Class');
            const riskMatch = riskClassContent.match(/\b([ABC])\b/i);
            const riskClass = riskMatch ? riskMatch[1].toUpperCase() : null;

            if (!riskClass) {
              errors.push('Risk Class must explicitly include one of: A, B, or C.');
            }

            const linkedInitiativeContent = getSectionContent('Linked Initiative Issue');
            const issueReferenceRegex = /#\d+\b|https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/\d+/i;
            const hasInitiativeReference = issueReferenceRegex.test(linkedInitiativeContent);

            if ((riskClass === 'A' || riskClass === 'B') && !hasInitiativeReference) {
              errors.push('Risk Class A/B PRs must include a linked initiative issue reference in "Linked Initiative Issue" (e.g., #123).');
            }

            if (errors.length > 0) {
              const checklistLines = [
                '- Ensure all required headings exist: `Risk Class`, `Linked Initiative Issue`, `Success Metric`, `Guardrail Metrics`, `Rollout Plan`, `Rollback Plan`, `Observability`, `Test-to-Risk Mapping`.',
                '- Add meaningful content in each required section (not `TBD`, `TODO`, `N/A`, or very short placeholders).',
                '- Check required checklist items in PR body:',
                '  - `I defined success + guardrail metrics`',
                '  - `I defined rollout + rollback plan`',
                '  - `I mapped tests to risk/failure modes`',
                '- Set `Risk Class` explicitly to `A`, `B`, or `C`.',
                '- If risk is `A` or `B`, add a linked initiative issue reference in `Linked Initiative Issue` (example: `#123`).'
              ];

              const body = [
                marker,
                '## 🛡️ PR Governance Gate Failed',
                '',
                'The governance check found the following issues:',
                ...errors.map((error) => `- ${error}`),
                '',
                '### How to fix',
                ...checklistLines,
                '',
                '_This comment is automatically updated by CI._'
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              core.setFailed(`PR governance gate failed. ${errors.join(' | ')}`);
              return;
            }

            const { data: passComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const stale = passComments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id,
              });
            }

            core.info('PR governance gate passed.');

  # Job 1: Run linting and unit tests
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Enforce query-layer coverage gate
        run: npm run test:coverage:query-gate

      - name: Generate module coverage report
        run: npm run test:coverage:modules

      - name: Publish module coverage summary
        run: |
          if [ -f coverage/module-coverage-summary.md ]; then
            cat coverage/module-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/module-coverage-summary.json
            coverage/module-coverage-summary.md

  # Job 1.5: E2E Tests
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [test, classify]
    timeout-minutes: 45
    # Product smoke gate: not needed for engineering-only master pushes.
    if: github.event_name == 'pull_request' || needs.classify.outputs.release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write E2E env config
        run: printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests (smoke gate)
        # The smoke project is the PR gate (landing, login, core navigation).
        # The full legacy suite is exercised post-deploy against staging by
        # staging-deploy.yml, where shared dev-project state is available.
        run: npm run test:e2e -- --project=smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # Job 1.6: Mutation Testing — disabled (re-enable by removing if: false)
  mutation-tests:
    name: 🧬 Mutation Tests
    runs-on: ubuntu-latest
    needs: test
    if: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload Stryker report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/

  # Job 1.7: Firestore Rules Tests (security gates)
  rules-tests:
    name: 🔒 Rules Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Firebase Emulator vX requires Java 21+; use 21 to match local dev
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        run: npm run test:rules

  # Job 1.8: Integration Tests (FinanceService + emulator)
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run integration tests with emulator
        run: npm run test:integration

  # Job 2: Auto-bump version (only on main branch)
  version-bump:
    name: 📦 Version Bump
    runs-on: ubuntu-latest
    needs: [test, classify]
    if: >-
      github.ref == 'refs/heads/master' &&
      !contains(github.event.head_commit.message, '[skip-version]') &&
      needs.classify.outputs.release == 'true'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: bump-type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" == *"!"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == feat:* ]] || [[ "$COMMIT_MSG" == *"feat("* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump
        run: |
          npm version ${{ steps.bump-type.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Git commits are source of truth (no CHANGELOG.md)
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip-version]" || echo "no changes to commit"
          git tag "v$NEW_VERSION" || echo "tag already exists"

      - name: Push version bump
        run: |
          git push origin master --follow-tags || echo "⚠️ Push failed — add CI_PAT secret (Settings → Secrets → Actions) with a PAT that has repo write access"

  # Job 3: Build for staging
  build-staging:
    name: 🏗️ Build Staging
    runs-on: ubuntu-latest
    needs: [test, classify]
    if: >-
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop') &&
      needs.classify.outputs.release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build:staging

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: staging-build
          path: dist/

  # Job 3: Deploy to staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-staging
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (staging)
        run: npm run deploy:staging -- --yes --skip-tests --skip-lint --skip-e2e --skip-mutation --skip-version-bump
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Job 4: Build for production (only on master branch)
  build-production:
    name: 🏗️ Build Production
    runs-on: ubuntu-latest
    needs: [test, classify]
    if: github.ref == 'refs/heads/master' && needs.classify.outputs.release == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write production env config
        run: printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}

      - name: Build for production
        run: npm run build:production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-build
          path: dist/

  # Job 4.5: Lighthouse CI (performance gates)
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build-production, classify]
    # Product-only performance gate: skipped when the product pipeline is
    # skipped for engineering-only/CI-only changes (needs propagation), and
    # skipped for BACKEND_RUNTIME-only changes: Functions/rules/indexes
    # deployments do not alter the served frontend, so a Lighthouse budget
    # gate is not meaningful (and must not block B1 backend rollouts).
    if: >
      github.ref == 'refs/heads/master' &&
      needs.build-production.result == 'success' &&
      needs.classify.outputs.category != 'BACKEND_RUNTIME'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # LHCI's startServerCommand boots vite preview on 4173 itself;
      # pre-starting a second server collides on the port.
      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  # Job 5: Deploy to production. Requires explicit owner approval via the
  # GitHub `production` environment. Deploys ONLY surfaces classified as
  # changed since the last successful production deploy; never reruns CI
  # validation inside the deployment (CI validated this exact SHA).
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-production, lighthouse, e2e-tests, rules-tests, classify]
    if: >
      github.ref == 'refs/heads/master' &&
      !cancelled() &&
      needs.build-production.result == 'success' &&
      needs.e2e-tests.result == 'success' &&
      needs.rules-tests.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute deployment surfaces since last production deploy
        id: surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow ci-cd.yml || true)
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          if [ -z "$BASE" ]; then
            echo "No successful production deploy on record — failing safe to ALL surfaces."
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$(git rev-list --max-parents=0 HEAD)" --functions "$FN_ALLOW")
          else
            RESULT=$(node scripts/ci/deploy-surface-classifier.js --from "$BASE" --functions "$FN_ALLOW")
          fi
          echo "$RESULT"
          SURFACES=""
          if jq -e '.hosting == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}hosting,"; fi
          if jq -e '.rules == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}rules,"; fi
          if jq -e '.indexes == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}indexes,"; fi
          if jq -e '.functions == true' <<< "$RESULT" > /dev/null; then SURFACES="${SURFACES}functions"; fi
          SURFACES="${SURFACES%,}"
          if [ -z "$SURFACES" ]; then
            echo "❌ Nothing to deploy to production (no changed surfaces since last deploy)."
            exit 1
          fi
          echo "prod_surfaces=$SURFACES" >> "$GITHUB_OUTPUT"
          echo "prod_functions=$(jq -r '.functionsToDeploy // "" | join(",")' <<< "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting')

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Write production env config
        run: |
          printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
          printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > functions/.env.production
        env:
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (production, surface-aware)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: ${{ steps.surfaces.outputs.prod_surfaces }}
          FUNCTIONS: ${{ steps.surfaces.outputs.prod_functions }}
        run: |
          set -euo pipefail
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:production -- "${ARGS[@]}"

      - name: Post-deploy release smoke (deployed production)
        if: contains(steps.surfaces.outputs.prod_surfaces, 'hosting') || contains(steps.surfaces.outputs.prod_surfaces, 'functions')
        env:
          E2E_BASE_URL: https://anchor-os.web.app
        run: npx playwright test --config config/playwright.release-smoke.config.ts

      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # The tag was pushed in the version-bump job. 
          # Now that production deploy succeeded, create the actual release.
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes \
            --notes "Production deployment of Anchor OS v$VERSION. See CHANGELOG.md for full commit history." || echo "Release already exists or failed to create"
