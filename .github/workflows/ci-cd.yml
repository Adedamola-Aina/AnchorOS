# CI/CD Pipeline - Runs tests and deploys to staging
name: CI/CD Pipeline

on:
  push:
    branches: [master, staging, develop]
  pull_request:
    branches: [master, staging]

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

env:
  NODE_VERSION: '20'

jobs:
  governance-gates:
    name: 🛡️ PR Governance Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR template governance sections
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('Not a pull request event. Skipping governance gate.');
              return;
            }

            const body = pr.body || '';
            const marker = '<!-- governance-gate-feedback -->';
            const requiredHeadings = [
              'Risk Class',
              'Success Metric',
              'Guardrail Metrics',
              'Rollout Plan',
              'Rollback Plan',
              'Observability',
              'Test-to-Risk Mapping'
            ];

            function getSectionContent(heading) {
              const sectionRegex = new RegExp(`###\\s+${heading}\\s*([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = body.match(sectionRegex);
              if (!match) return '';

              return match[1]
                .replace(/<!--([\\s\\S]*?)-->/g, '')
                .replace(/\r/g, '')
                .trim();
            }

            const missingHeadings = requiredHeadings.filter((heading) => {
              const headingRegex = new RegExp(`^###\\s+${heading}\\s*$`, 'im');
              return !headingRegex.test(body);
            });

            function hasMeaningfulContent(heading) {
              const content = getSectionContent(heading);
              if (!content) return false;

              if (content.length < 12) return false;
              if (/^(tbd|todo|n\\/?a|none)$/i.test(content)) return false;
              return true;
            }

            const emptySections = requiredHeadings.filter((heading) => !hasMeaningfulContent(heading));

            const requiredChecks = [
              'I defined success + guardrail metrics',
              'I defined rollout + rollback plan',
              'I mapped tests to risk/failure modes'
            ];

            const unchecked = requiredChecks.filter((item) => {
              const checkedRegex = new RegExp(`-\\s*\\[x\\]\\s*${item.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')}`, 'i');
              return !checkedRegex.test(body);
            });

            const errors = [];
            if (missingHeadings.length) errors.push(`Missing headings: ${missingHeadings.join(', ')}`);
            if (emptySections.length) errors.push(`Sections need meaningful content: ${emptySections.join(', ')}`);
            if (unchecked.length) errors.push(`Required checklist items must be checked: ${unchecked.join(', ')}`);

            const riskClassContent = getSectionContent('Risk Class');
            const riskMatch = riskClassContent.match(/\b([ABC])\b/i);
            const riskClass = riskMatch ? riskMatch[1].toUpperCase() : null;

            if (!riskClass) {
              errors.push('Risk Class must explicitly include one of: A, B, or C.');
            }

            const linkedInitiativeContent = getSectionContent('Linked Initiative Issue');
            const issueReferenceRegex = /#\d+\b|https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/\d+/i;
            const hasInitiativeReference = issueReferenceRegex.test(linkedInitiativeContent);

            if ((riskClass === 'A' || riskClass === 'B') && !hasInitiativeReference) {
              errors.push('Risk Class A/B PRs must include a linked initiative issue reference in "Linked Initiative Issue" (e.g., #123).');
            }

            // Block PRs that reference deferred/completed roadmap IDs unless explicitly overridden.
            // This prevents accidental re-work or duplicate delivery on closed/deferred initiatives.
            const overrideLabels = new Set(['governance-override', 'allow-completed-id']);
            const labelNames = new Set((pr.labels || []).map((label) => String(label.name || '').toLowerCase()));
            const hasOverrideLabel = [...overrideLabels].some((label) => labelNames.has(label));

            try {
              const roadmapPath = 'tools/dashboard/server/roadmap.json';
              const { data: roadmapFile } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: roadmapPath,
              });

              if (!Array.isArray(roadmapFile) && roadmapFile?.content) {
                const roadmapRaw = Buffer.from(roadmapFile.content, 'base64').toString('utf8');
                const roadmap = JSON.parse(roadmapRaw);
                const initiatives = Array.isArray(roadmap?.initiatives) ? roadmap.initiatives : [];

                const roadmapById = new Map(
                  initiatives
                    .filter((item) => item?.id && item?.status)
                    .map((item) => [String(item.id).toUpperCase(), { status: String(item.status).toLowerCase(), title: item.title || '' }])
                );

                const referencedIds = new Set((`${pr.title || ''}\n${body}`).toUpperCase().match(/\b[A-Z]{2,6}-\d{3}\b/g) || []);
                const blockedIds = [];

                for (const id of referencedIds) {
                  const roadmapItem = roadmapById.get(id);
                  if (!roadmapItem) continue;
                  if (roadmapItem.status === 'completed' || roadmapItem.status === 'deferred') {
                    blockedIds.push({ id, status: roadmapItem.status, title: roadmapItem.title });
                  }
                }

                if (blockedIds.length > 0 && !hasOverrideLabel) {
                  const summary = blockedIds
                    .slice(0, 5)
                    .map((item) => `${item.id} (${item.status})${item.title ? `: ${item.title}` : ''}`)
                    .join('; ');

                  errors.push(
                    `PR references deferred/completed roadmap item(s): ${summary}. Add label 'governance-override' (or 'allow-completed-id') with justification if this is intentional.`
                  );
                }
              }
            } catch (roadmapErr) {
              core.warning(`Roadmap status check skipped: ${roadmapErr.message}`);
            }

            if (errors.length > 0) {
              const checklistLines = [
                '- Ensure all required headings exist: `Risk Class`, `Linked Initiative Issue`, `Success Metric`, `Guardrail Metrics`, `Rollout Plan`, `Rollback Plan`, `Observability`, `Test-to-Risk Mapping`.',
                '- Add meaningful content in each required section (not `TBD`, `TODO`, `N/A`, or very short placeholders).',
                '- Check required checklist items in PR body:',
                '  - `I defined success + guardrail metrics`',
                '  - `I defined rollout + rollback plan`',
                '  - `I mapped tests to risk/failure modes`',
                '- Set `Risk Class` explicitly to `A`, `B`, or `C`.',
                '- If risk is `A` or `B`, add a linked initiative issue reference in `Linked Initiative Issue` (example: `#123`).'
              ];

              const body = [
                marker,
                '## 🛡️ PR Governance Gate Failed',
                '',
                'The governance check found the following issues:',
                ...errors.map((error) => `- ${error}`),
                '',
                '### How to fix',
                ...checklistLines,
                '',
                '_This comment is automatically updated by CI._'
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              core.setFailed(`PR governance gate failed. ${errors.join(' | ')}`);
              return;
            }

            const { data: passComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const stale = passComments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id,
              });
            }

            core.info('PR governance gate passed.');

  # Job 1: Run linting and unit tests
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test -- --run

      - name: Enforce query-layer coverage gate
        run: npm run test:coverage:query-gate

      - name: Generate module coverage report
        run: npm run test:coverage:modules

      - name: Publish module coverage summary
        run: |
          if [ -f coverage/module-coverage-summary.md ]; then
            cat coverage/module-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/module-coverage-summary.json
            coverage/module-coverage-summary.md

  # Job 1.5: E2E Tests
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # Job 1.6: Mutation Testing — disabled (re-enable by removing if: false)
  mutation-tests:
    name: 🧬 Mutation Tests
    runs-on: ubuntu-latest
    needs: test
    if: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: Upload Stryker report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/

  # Job 1.7: Firestore Rules Tests (security gates)
  rules-tests:
    name: 🔒 Rules Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Firebase Emulator vX requires Java 21+; use 21 to match local dev
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore rules tests
        run: npm run test:rules

  # Job 1.8: Integration Tests (FinanceService + emulator)
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java (for Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run integration tests with emulator
        run: npm run test:integration

  # Job 2: Auto-bump version (only on main branch)
  version-bump:
    name: 📦 Version Bump
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip-version]')
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CI_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: bump-type
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" == *"!"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == feat:* ]] || [[ "$COMMIT_MSG" == *"feat("* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump
        run: |
          npm version ${{ steps.bump-type.outputs.type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Git commits are source of truth (no CHANGELOG.md)
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip-version]" || echo "no changes to commit"
          git tag "v$NEW_VERSION" || echo "tag already exists"

      - name: Push version bump
        run: |
          git push origin master --follow-tags || echo "⚠️ Push failed — add CI_PAT secret (Settings → Secrets → Actions) with a PAT that has repo write access"

  # Job 2.5: Auto-deploy to dev (dev always tracks master HEAD)
  build-dev:
    name: 🏗️ Build Dev
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for development
        run: npm run build:dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: dist/

  deploy-dev:
    name: 🚀 Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-dev
    if: github.ref == 'refs/heads/master'
    # No environment gate — dev auto-deploys on every push to master
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Firebase Dev
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          projectId: anchor-os-dev-1c6ec
          channelId: live

  # Job 3: Build for staging
  build-staging:
    name: 🏗️ Build Staging
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for staging
        run: npm run build:staging

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: dist/

  # Job 3: Deploy to staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-staging
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (staging)
        run: npm run deploy:staging -- --yes --skip-tests --skip-lint --skip-e2e --skip-mutation --skip-version-bump
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # Job 4: Build for production (only on master branch)
  build-production:
    name: 🏗️ Build Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build:production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/

  # Job 4.5: Lighthouse CI (performance gates)
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-production
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start preview server for LHCI
        run: |
          # Start Vite preview serving the built `dist` on port 4173 in background
          npm run preview -- --port 4173 --strictPort &
          # Wait for server to respond
          for i in $(seq 1 30); do
            if curl -sSf http://localhost:4173/ >/dev/null 2>&1; then
              echo "Preview server is up";
              break;
            fi;
            sleep 1;
          done

      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/

  # Job 5: Deploy to production (requires manual approval)
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-production, lighthouse, e2e-tests, rules-tests]
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy via guarded pipeline (production)
        run: npm run deploy:production -- --yes --skip-tests --skip-lint --skip-e2e --skip-mutation --skip-version-bump
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # The tag was pushed in the version-bump job. 
          # Now that production deploy succeeded, create the actual release.
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --generate-notes \
            --notes "Production deployment of Anchor OS v$VERSION. See CHANGELOG.md for full commit history." || echo "Release already exists or failed to create"
