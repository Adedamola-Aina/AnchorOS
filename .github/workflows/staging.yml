name: Staging Deploy
run-name: 'Staging ${{ inputs.mode }} ${{ inputs.sha }}'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact master commit SHA to deploy (must be the current origin/master tip with successful CI)'
        required: true
        type: string
      mode:
        description: 'Deployment mode: normal (surface-aware) or b1 (rules first, then the five allowed Functions; no Hosting/indexes)'
        required: true
        type: choice
        default: 'normal'
        options:
          - normal
          - b1
      authorize_bootstrap:
        description: 'normal mode only: explicit operator authorization for a FIRST deployment when no normal staging baseline exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Staging authorization model (run-name carries mode + SHA for provenance):
#   0. MERGING/PUSHING TO MASTER NEVER MUTATES STAGING. Dispatch only, and only
#      from a master workflow ref (resolve-sha rejects anything else).
#   1. resolve-sha: requested SHA must be the current origin/master tip.
#   2. await-validation: CI (ci.yml) must have succeeded for THAT EXACT SHA.
#   3. mode=normal: surface-aware deploy classified against the last successful
#      *normal* staging baseline (run names prefixed "Staging normal"; B1 runs
#      are excluded from the baseline by last-deployed-sha.js --title-prefix).
#      No baseline -> FAIL CLOSED with bootstrap_required unless the operator
#      explicitly passed authorize_bootstrap=true, which runs the explicit FIRST
#      NORMAL deployment plan (all four surfaces, unfiltered Functions surface).
#   4. mode=b1: NO baseline required. ONE mutation job with TWO SEQUENTIAL
#      steps: Firestore rules FIRST, then exactly the five allowed Functions.
#      Never Hosting, never indexes, never one combined firebase command.
#   5. A successful B1 run is a PARTIAL deployment and never becomes a normal
#      whole-SHA baseline.
#   6. All build/plan/mutate jobs check out the authorized exact SHA explicitly.

jobs:
  resolve-sha:
    name: 🔐 Resolve & Authorize Requested SHA
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      mode: ${{ steps.auth.outputs.mode }}
    steps:
      - name: Reject non-master workflow refs
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Dispatch rejected: this workflow may only run from refs/heads/master (got ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify requested SHA is authorized master history
        id: auth
        env:
          REQUESTED: ${{ inputs.sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git fetch origin master --tags
          TIP=$(git rev-parse origin/master)
          if [ -z "$REQUESTED" ]; then
            echo "❌ No SHA supplied. Dispatch this workflow with the exact master commit SHA to deploy."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REQUESTED" "$TIP"; then
            echo "❌ Requested SHA $REQUESTED is NOT part of master history. Refusing to deploy."
            exit 1
          fi
          if [ "$REQUESTED" != "$TIP" ]; then
            echo "❌ Requested SHA $REQUESTED is not the current master tip ($TIP)."
            echo "   Only the current master tip can be deployed to staging (keeps provenance exact)."
            exit 1
          fi
          if [ "$MODE" != "normal" ] && [ "$MODE" != "b1" ]; then
            echo "❌ Unknown mode '$MODE'. Allowed: normal, b1."
            exit 1
          fi
          echo "✅ Requested SHA $REQUESTED is the current master tip (mode: $MODE)."
          echo "sha=$REQUESTED" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  await-validation:
    name: ⏳ Await CI Validation (exact SHA)
    runs-on: ubuntu-latest
    needs: [resolve-sha]
    steps:
      - name: Await successful CI run for this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve-sha.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # Release provenance lookup: `gh run list` emits JSON and the real
            # `jq` binary extracts the state for the EXACT SHA. gh's --jq flag
            # cannot take jq --arg parameters — passing them that way failed
            # silently and every lookup became "none". Lookup errors are NOT
            # suppressed: a real gh/jq failure fails this gate visibly.
            STATE=$(gh run list --repo "$REPO" --workflow ci.yml --json headSha,status,conclusion --limit 100 \
              | jq -r --arg sha "$SHA" '[.[] | select(.headSha == $sha)][0] | (if . == null then "none" else .status + ":" + (.conclusion // "pending") end)')
            echo "attempt ${i}: ${STATE}"
            case "$STATE" in
              completed:success)
                echo "✅ CI validation passed for ${SHA}"
                exit 0
                ;;
              completed:*)
                echo "❌ CI validation for ${SHA} did not pass: ${STATE}"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "❌ Timed out awaiting CI validation for ${SHA}"
          exit 1

  plan:
    name: 🧭 Plan Deployment (mode-aware)
    runs-on: ubuntu-latest
    needs: [resolve-sha, await-validation]
    outputs:
      sha: ${{ needs.resolve-sha.outputs.sha }}
      mode: ${{ steps.base.outputs.mode }}
      deploy_hosting: ${{ steps.plan.outputs.deploy_hosting }}
      deploy_rules: ${{ steps.plan.outputs.deploy_rules }}
      deploy_indexes: ${{ steps.plan.outputs.deploy_indexes }}
      deploy_functions: ${{ steps.plan.outputs.deploy_functions }}
      functions_to_deploy: ${{ steps.plan.outputs.functions_to_deploy }}
      ci_only: ${{ steps.plan.outputs.ci_only }}
      base_sha: ${{ steps.base.outputs.base_sha }}
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}
          fetch-depth: 0

      - name: Resolve normal baseline (fail closed) / B1 requires none
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.resolve-sha.outputs.mode }}
          AUTHORIZE: ${{ inputs.authorize_bootstrap }}
        run: |
          set -euo pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" == "b1" ]; then
            echo "B1 mode: no staging baseline required — this is a partial phased rollout."
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normal mode: only successful NORMAL runs count as the whole-SHA baseline.
          # last-deployed-sha.js fetches a bounded run history and filters by title.
          BASE=$(node scripts/ci/last-deployed-sha.js --workflow staging.yml --title-prefix "Staging normal" || true)
          if [ -z "$BASE" ]; then
            if [ "$AUTHORIZE" != "true" ]; then
              echo "❌ bootstrap_required"
              echo "   No trustworthy previous NORMAL staging deployment exists."
              echo "   An unknown baseline is NEVER treated as 'deploy everything',"
              echo "   and merging to master never mutates staging by itself."
              echo "   An operator must either establish a verified baseline (a previous"
              echo "   successful normal staging deploy) or explicitly re-dispatch with"
              echo "   authorize_bootstrap=true for the authorized FIRST NORMAL deployment."
              exit 1
            fi
            echo "⚠️ No baseline — operator EXPLICITLY authorized the FIRST NORMAL deployment."
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "Last successfully deployed NORMAL staging SHA: $BASE"
            echo "base_sha=$BASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute deployment plan
        id: plan
        env:
          MODE: ${{ needs.resolve-sha.outputs.mode }}
          BASE: ${{ steps.base.outputs.base_sha }}
        run: |
          set -euo pipefail
          # B1-mode-only allow-list: exactly these Functions, nothing else.
          # mode=normal NEVER passes this filter to the classifier — an empty
          # functions filter means the NORMAL Functions surface.
          FN_ALLOW="disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
          echo "fn_allow=$FN_ALLOW" >> "$GITHUB_OUTPUT"
          if [ "$MODE" == "b1" ]; then
            echo "B1 plan: rules surface only first; Functions second; NEVER Hosting/indexes."
            echo "deploy_hosting=false"    >> "$GITHUB_OUTPUT"
            echo "deploy_rules=true"      >> "$GITHUB_OUTPUT"
            echo "deploy_indexes=false"   >> "$GITHUB_OUTPUT"
            echo "deploy_functions=true"  >> "$GITHUB_OUTPUT"
            echo "functions_to_deploy=$FN_ALLOW" >> "$GITHUB_OUTPUT"
            echo "ci_only=false"          >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ]; then
            # Explicitly authorized FIRST NORMAL deployment: whole-environment
            # baseline. All four surfaces; EMPTY functions filter = the NORMAL
            # Functions surface (never the B1 five).
            echo "Authorized normal bootstrap plan: full environment."
            echo "deploy_hosting=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_rules=true"      >> "$GITHUB_OUTPUT"
            echo "deploy_indexes=true"    >> "$GITHUB_OUTPUT"
            echo "deploy_functions=true"  >> "$GITHUB_OUTPUT"
            echo "functions_to_deploy="    >> "$GITHUB_OUTPUT"
            echo "ci_only=false"          >> "$GITHUB_OUTPUT"
          else
            # Normal mode: classify vs the normal baseline WITHOUT the B1 filter.
            node scripts/ci/deploy-surface-classifier.js --from "$BASE"
          fi

  build-hosting:
    name: 🏗️ Build Staging Hosting (once, normal mode only)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.mode == 'normal' && needs.plan.outputs.ci_only != 'true' && needs.plan.outputs.deploy_hosting == 'true'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write staging frontend env config
        run: printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
      - run: npm run build:staging
      - uses: actions/upload-artifact@v7
        with:
          name: staging-dist
          path: dist/

  deploy:
    name: 🚀 Deploy Changed Surfaces to Staging (normal)
    runs-on: ubuntu-latest
    needs: [plan, build-hosting]
    if: >-
      !cancelled() &&
      needs.plan.outputs.mode == 'normal' &&
      needs.plan.outputs.ci_only != 'true' &&
      needs.plan.result == 'success' &&
      (needs.build-hosting.result == 'success' || needs.build-hosting.result == 'skipped')
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Write staging env config
        run: |
          printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
          printf '%s\n' "$STAGING_FUNCTIONS_ENV" > functions/.env.staging
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
          STAGING_FUNCTIONS_ENV: ${{ secrets.STAGING_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy validated surfaces
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          SURFACES: "${{ needs.plan.outputs.deploy_hosting == 'true' && 'hosting,' || '' }}${{ needs.plan.outputs.deploy_rules == 'true' && 'rules,' || '' }}${{ needs.plan.outputs.deploy_indexes == 'true' && 'indexes,' || '' }}${{ needs.plan.outputs.deploy_functions == 'true' && 'functions' || '' }}"
          FUNCTIONS: ${{ needs.plan.outputs.functions_to_deploy }}
        run: |
          set -euo pipefail
          SURFACES="${SURFACES%,}"
          ARGS=(--yes --skip-tests --skip-lint --skip-audit --skip-e2e --skip-mutation --skip-version-bump --no-deploy-marker --surfaces="$SURFACES")
          if [ -n "$FUNCTIONS" ]; then
            ARGS+=(--functions="$FUNCTIONS")
          fi
          npm run deploy:staging -- "${ARGS[@]}"

  deploy-b1:
    name: 🛡️ B1 Phased Deployment — rules FIRST, then the five Functions (ONE mutation job)
    runs-on: ubuntu-latest
    needs: [plan]
    if: needs.plan.outputs.mode == 'b1'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup dependencies (once)
        run: npm ci
      - name: Install functions dependencies
        run: npm ci
        working-directory: functions
      - name: Write BOTH staging env configs (app + Functions)
        run: |
          printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
          printf '%s\n' "$STAGING_FUNCTIONS_ENV" > functions/.env.staging
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
          STAGING_FUNCTIONS_ENV: ${{ secrets.STAGING_FUNCTIONS_ENV }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 'B1 Step A: deploy Firestore rules ONLY (containment first)'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npm run deploy:staging -- \
            --yes \
            --skip-tests \
            --skip-lint \
            --skip-audit \
            --skip-e2e \
            --skip-mutation \
            --skip-version-bump \
            --no-deploy-marker \
            --surfaces=rules

      - name: 'B1 Step B: deploy exactly the five B1 Functions (only after rules succeed)'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FN_ALLOW: "disconnectFamily,shareAccount,runMigration,listMigrations,getMigrationStatus"
        run: |
          set -euo pipefail
          npm run deploy:staging -- \
            --yes \
            --skip-tests \
            --skip-lint \
            --skip-audit \
            --skip-e2e \
            --skip-mutation \
            --skip-version-bump \
            --no-deploy-marker \
            --surfaces=functions \
            --functions="$FN_ALLOW"

  release-smoke:
    name: 🎯 Release Smoke (normal)
    runs-on: ubuntu-latest
    needs: [plan, deploy]
    if: >-
      !cancelled() &&
      needs.plan.outputs.mode == 'normal' &&
      needs.deploy.result == 'success'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run release smoke against deployed staging
        run: npx playwright test --config config/playwright.release-smoke.config.ts
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  release-smoke-b1:
    name: 🎯 Release Smoke (B1)
    runs-on: ubuntu-latest
    needs: [plan, deploy-b1]
    if: >-
      !cancelled() &&
      needs.plan.outputs.mode == 'b1' &&
      needs.deploy-b1.result == 'success'
    steps:
      - name: Checkout authorized exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run release smoke against deployed staging
        run: npx playwright test --config config/playwright.release-smoke.config.ts
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - name: Upload release smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-b1-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  post-deploy-e2e:
    name: Post-Deploy E2E (non-blocking, normal mode)
    runs-on: ubuntu-latest
    needs: [plan, release-smoke]
    if: >-
      !cancelled() &&
      needs.plan.outputs.mode == 'normal' &&
      needs.release-smoke.result == 'success'
    continue-on-error: true
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Write E2E env config
        run: printf '%s\n' "$E2E_VITE_ENV" > .env.development
        env:
          E2E_VITE_ENV: ${{ secrets.E2E_VITE_ENV }}
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config config/playwright.config.ts --shard=${{ matrix.shard }}/4
        env:
          E2E_BASE_URL: ${{ secrets.STAGING_URL }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
