name: Revival Lockfile Repair

on:
  push:
    branches:
      - revival/sept-2026-hardening

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revival/sept-2026-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Repair ESLint peer dependency and lockfile
        run: npm install eslint-plugin-react-hooks@^7.1.1 --save-dev --package-lock-only --ignore-scripts
      - name: Commit repaired dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes required"
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "fix(deps): align React hooks plugin with ESLint 10 [lockfile-repair]"
          git push origin HEAD:revival/sept-2026-hardening
