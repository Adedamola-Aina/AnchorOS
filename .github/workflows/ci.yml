name: CI

# Single authoritative PR CI + master validation workflow.
# - pull_request: governance metadata check, classify, lint/types/unit, rules,
#   integration, and — only for PRs that change product-runtime surfaces —
#   ONE bounded Chromium smoke gate (retries 0, 20s/test, 3-minute global
#   bound, deterministic login, no legacy smoke project). Engineering-only,
#   CI-only, and backend-only PRs run zero Playwright. No deploy jobs.
# - push to master: proves the merged SHA (consumed by staging.yml / production.yml).
# - schedule: weekly full regression against staging (merged from weekly-health).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 22 * * 0'
  # Dispatchable so the Release Versioning workflow (version.yml) can request
  # validation of the release commit it just pushed: a push made with the
  # default GITHUB_TOKEN does not trigger workflows, and staging/production only
  # deploy a SHA whose ci.yml run succeeded.
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: read

env:
  NODE_VERSION: '22'

# A newer PR event supersedes older work for the same PR. Master validation is
# never cancelled because staging/production consume the exact completed SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 0: Classify changed files (deterministic, repository-owned).
  # Engineering-only and CI-only master pushes must not trigger product
  # versioning/builds/deployments. Mixed or unknown changes fail safe to
  # the normal release pipeline.
  classify:
    name: 🔎 Classify Changed Files
    runs-on: ubuntu-latest
    outputs:
      category: ${{ steps.classify.outputs.category }}
      release: ${{ steps.classify.outputs.release }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      backend_changed: ${{ steps.classify.outputs.backend_changed }}
      functions_changed: ${{ steps.classify.outputs.functions_changed }}
      rules_changed: ${{ steps.classify.outputs.rules_changed }}
      query_changed: ${{ steps.classify.outputs.query_changed }}
      smoke_required: ${{ steps.classify.outputs.smoke_required }}
      ci_infra_changed: ${{ steps.classify.outputs.ci_infra_changed }}
      engineering_only_changed: ${{ steps.classify.outputs.engineering_only_changed }}
      engineering_code_changed: ${{ steps.classify.outputs.engineering_code_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD || true)
          else
            FILES=$(git diff --name-only "HEAD~1" HEAD || true)
          fi
          # Fail safe: if no diff can be determined, prefer release validation.
          if [ -z "$FILES" ]; then
            echo "Changed-file set undeterminable; failing safe to release pipeline."
            echo "category=PRODUCT_RUNTIME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "ci_infra_changed=false" >> "$GITHUB_OUTPUT"
            echo "engineering_only_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/changed-files.txt
          node scripts/ci/classify-changes.js --files $(cat /tmp/changed-files.txt)


  governance-gates:
    name: 🛡️ PR Governance Gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Validate PR template governance sections
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('Not a pull request event. Skipping governance gate.');
              return;
            }

            // Bot-authored PRs (Dependabot) cannot fill in the human PR template, so
            // the governance gate would block every dependency update forever — which
            // is exactly what happened: 16 dependency PRs sat unmergeable. Authored
            // changes are still gated here; bot updates remain gated by the rest of
            // CI, including the dependency audit and the full test suites.
            const author = pr.user?.login || '';
            if (pr.user?.type === 'Bot' || author.endsWith('[bot]')) {
              core.info(`Governance gate skipped for bot author ${author}.`);
              return;
            }

            const body = pr.body || '';
            const marker = '<!-- governance-gate-feedback -->';
            const requiredHeadings = [
              'Risk Class',
              'Success Metric',
              'Guardrail Metrics',
              'Rollout Plan',
              'Rollback Plan',
              'Observability',
              'Test-to-Risk Mapping'
            ];

            function getSectionContent(heading) {
              const sectionRegex = new RegExp(`###\\s+${heading}\\s*([\\s\\S]*?)(?=\\n###\\s+|$)`, 'i');
              const match = body.match(sectionRegex);
              if (!match) return '';

              return match[1]
                .replace(/<!--([\s\S]*?)-->/g, '')
                .replace(/\r/g, '')
                .trim();
            }

            const missingHeadings = requiredHeadings.filter((heading) => {
              const headingRegex = new RegExp(`^###\\s+${heading}\\s*$`, 'im');
              return !headingRegex.test(body);
            });

            function hasMeaningfulContent(heading) {
              const content = getSectionContent(heading);
              if (!content) return false;

              if (content.length < 12) return false;
              if (/^(tbd|todo|n\/?a|none)$/i.test(content)) return false;
              return true;
            }

            const emptySections = requiredHeadings.filter((heading) => !hasMeaningfulContent(heading));

            const requiredChecks = [
              'I defined success + guardrail metrics',
              'I defined rollout + rollback plan',
              'I mapped tests to risk/failure modes'
            ];

            const unchecked = requiredChecks.filter((item) => {
              const checkedRegex = new RegExp(`-\\s*\\[x\\]\\s*${item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
              return !checkedRegex.test(body);
            });

            const errors = [];
            if (missingHeadings.length) errors.push(`Missing headings: ${missingHeadings.join(', ')}`);
            if (emptySections.length) errors.push(`Sections need meaningful content: ${emptySections.join(', ')}`);
            if (unchecked.length) errors.push(`Required checklist items must be checked: ${unchecked.join(', ')}`);

            const riskClassContent = getSectionContent('Risk Class');
            const riskMatch = riskClassContent.match(/\b([ABC])\b/i);
            const riskClass = riskMatch ? riskMatch[1].toUpperCase() : null;

            if (!riskClass) {
              errors.push('Risk Class must explicitly include one of: A, B, or C.');
            }

            const linkedInitiativeContent = getSectionContent('Linked Initiative Issue');
            const issueReferenceRegex = /#\d+\b|https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/\d+/i;
            const hasInitiativeReference = issueReferenceRegex.test(linkedInitiativeContent);

            if ((riskClass === 'A' || riskClass === 'B') && !hasInitiativeReference) {
              errors.push('Risk Class A/B PRs must include a linked initiative issue reference in "Linked Initiative Issue" (e.g., #123).');
            }

            if (errors.length > 0) {
              const checklistLines = [
                '- Ensure all required headings exist: `Risk Class`, `Linked Initiative Issue`, `Success Metric`, `Guardrail Metrics`, `Rollout Plan`, `Rollback Plan`, `Observability`, `Test-to-Risk Mapping`.',
                '- Add meaningful content in each required section (not `TBD`, `TODO`, `N/A`, or very short placeholders).',
                '- Check required checklist items in PR body:',
                '  - `I defined success + guardrail metrics`',
                '  - `I defined rollout + rollback plan`',
                '  - `I mapped tests to risk/failure modes`',
                '- Set `Risk Class` explicitly to `A`, `B`, or `C`.',
                '- If risk is `A` or `B`, add a linked initiative issue reference in `Linked Initiative Issue` (example: `#123`).'
              ];

              const body = [
                marker,
                '## 🛡️ PR Governance Gate Failed',
                '',
                'The governance check found the following issues:',
                ...errors.map((error) => `- ${error}`),
                '',
                '### How to fix',
                ...checklistLines,
                '',
                '_This comment is automatically updated by CI._'
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existing = comments.find((comment) =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }

              core.setFailed(`PR governance gate failed. ${errors.join(' | ')}`);
              return;
            }

            const { data: passComments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const stale = passComments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (stale) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stale.id,
              });
            }

            core.info('PR governance gate passed.');


  # CI/workflow implementation: Node-native invariant tests only. No product
  # dependencies, browser, emulators, Functions install or application suite.
  ci-infra:
    name: ⚙️ CI Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify]
    if: needs.classify.outputs.ci_infra_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Run CI/release invariant tests
        run: node --test scripts/ci/*.node-suite.mjs

  # Non-runtime engineering code (scripts/tools/e2e/config) gets a normal lint
  # pass, but docs/contracts alone do not install the application dependency tree.
  engineering-checks:
    name: 🧰 Engineering Checks
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [classify]
    if: needs.classify.outputs.engineering_code_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  # UX-GL-07: proves the developer-only surfaces cannot reach production. A gate
  # is an intention; this builds the real production bundle and fails if the
  # environment banner, Developer Tools section or query devtools survived into
  # the shipped assets.
  dev-surface-gate:
    name: 🚧 Dev Surface Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [classify]
    if: needs.classify.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:production
      - run: npm run check:dev-surface

  frontend-checks:
    name: 🖥️ Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [classify]
    if: needs.classify.outputs.frontend_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint + typecheck
        run: |
          npm run lint
          npx tsc -b config/tsconfig.app.json config/tsconfig.node.json config/tsconfig.spec.json
      - name: Product unit tests
        run: npm run test:run
      - name: Query-layer coverage gate
        if: needs.classify.outputs.query_changed == 'true'
        run: npm run test:coverage:query-gate

  backend-checks:
    name: 🔧 Functions Checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [classify]
    if: needs.classify.outputs.functions_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Build Functions
        run: npm run build
        working-directory: functions
      - name: Typecheck Functions tests
        run: npm run typecheck
        working-directory: functions
      - name: Functions unit tests
        run: npx vitest run --config vitest.config.ts
        working-directory: functions

  rules-tests:
    name: 🔒 Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [classify]
    if: needs.classify.outputs.rules_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm run test:rules:ci

  integration-tests:
    name: 🔗 Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [classify]
    if: >-
      needs.classify.outputs.functions_changed == 'true' ||
      needs.classify.outputs.rules_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npm run test:integration

  # Functions emulator suites (claim lifecycle, end-to-end handler idempotency and
  # family revocation). These are the only tests that prove transaction and
  # concurrency behavior against a real Firestore emulator, and no other job runs
  # functions/vitest.emulator.config.ts — `test:integration` runs client tests
  # selected by name pattern. Without this job those suites can rot while CI stays
  # green.
  emulator-tests:
    name: 🧪 Emulator Integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [classify]
    if: >-
      needs.classify.outputs.functions_changed == 'true' ||
      needs.classify.outputs.rules_changed == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - name: Functions emulator suites
        run: npm run test:functions:emulator

  e2e-tests:
    name: 🎭 Bounded Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [classify]
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.smoke_required == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: cp .env.example .env.development
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - name: Start local smoke emulators
        run: |
          nohup firebase emulators:start --project demo-anchor-os --only auth,firestore > emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:9099; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:9099 || { tail -50 emulator.log; exit 1; }
      - name: Seed deterministic local smoke identity
        run: node scripts/ci/seed-release-emulator.mjs
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_PROJECT_ID: demo-anchor-os
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release-smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: bounded-smoke-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  # Expensive breadth belongs on the schedule, not ordinary PR/master events.
  scheduled-quality:
    name: 📊 Scheduled Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run lint
      - run: npm run test:run
      - run: npm run test:coverage:query-gate
      - run: npx vitest run --config vitest.config.ts
        working-directory: functions
      - run: npm run test:coverage:modules
      - name: Publish module coverage summary
        run: |
          if [ -f coverage/module-coverage-summary.md ]; then
            cat coverage/module-coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            coverage/module-coverage-summary.json
            coverage/module-coverage-summary.md
          retention-days: 14

  # Weekly full regression (merged from weekly-health.yml). Runs only on the
  # scheduled event, hermetically against the local emulator suite — never on
  # the PR path, and never against a cloud origin: the general suite fail-closes
  # on a non-loopback E2E_BASE_URL and its fixture identity only exists in the
  # emulators (see also the removed post-deploy E2E job, #199).
  #
  # It goes through the canonical local runner so Playwright always receives its
  # explicit `--config`. A bare `playwright test` (no config) uses Playwright's
  # default discovery, collects the Vitest suites, and dies on
  # `TypeError: Cannot redefine property: Symbol($$jest-matchers-object)`
  # (issue #143) — that invariant is now pinned by
  # scripts/ci/playwright-config.node-suite.mjs.
  scheduled-full-regression:
    name: 📅 Full E2E Regression (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e:local -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
