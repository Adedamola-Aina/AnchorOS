name: Release Versioning

# AUTOMATIC release versioning — there is no manual bump step anywhere.
#
# WHY THIS IS A SEPARATE WORKFLOW (do not fold it into the deploy workflows):
#   * staging.yml and production.yml are DISPATCH-ONLY deployments: pushing to
#     master must never mutate an environment.
#   * production.yml is invariant-tested to never push, commit, or version-bump
#     master (scripts/ci/deploy-surface.node-suite.mjs).
#   * staging.yml already passes --skip-version-bump to the deploy tooling —
#     that flag is the contract that THIS workflow owns the bump.
#   * So the split is: versioning/repackaging happens here automatically on
#     merge to master; deployment stays an explicitly authorized dispatch of an
#     exact, CI-validated SHA.
#
# What one run does, in order:
#   1. refuses to run off master,
#   2. stops if the tip is already a release commit (loop guard),
#   3. stops if the tip is already tagged at the package.json version (idempotent),
#   4. derives the bump from Conventional Commits since the last tag via
#      commit-and-tag-version (feat -> minor, fix -> patch, BREAKING -> major)
#      so nobody ever types a version number,
#   5. commits `chore(release): <tag>` and pushes the commit + annotated tag,
#   6. explicitly requests CI for the release commit, because a GITHUB_TOKEN
#      push does NOT trigger other workflows and staging/production only deploy
#      a SHA whose ci.yml run succeeded — without this the release could never ship,
#   7. publishes the GitHub Release, which is the authoritative release history.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel: rc (staging), production (final), dev (local prerelease)'
        required: true
        type: choice
        default: rc
        options:
          - rc
          - production
          - dev

permissions:
  contents: write
  actions: write

# Never let two release runs race on the same master tip.
concurrency:
  group: release-versioning
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  version-bump:
    name: 🏷️ Bump, tag and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-master refs
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "❌ Release versioning only runs from refs/heads/master (got ${{ github.ref }})."
            exit 1
          fi

      - name: Checkout master with full history and tags
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether a release is needed
        id: decide
        env:
          CHANNEL: ${{ inputs.channel || 'rc' }}
        run: |
          set -euo pipefail
          git fetch origin master --tags --force
          SUBJECT=$(git log -1 --pretty=%s)
          if printf '%s' "$SUBJECT" | grep -qE '^chore\(release\):'; then
            echo "⏭️  Tip is already a release commit ($SUBJECT) — loop guard fired, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')
          PKG_VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          # Idempotence must mean "HEAD *is* the tagged release commit", not
          # "package.json equals the latest tag": after the first rc bump the two
          # are equal forever, which would silently stop every later release.
          # Commits landing after the tag always warrant a new release.
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n1 "$LATEST_TAG" 2>/dev/null || echo '')
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" = "v$PKG_VERSION" ] && [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "⏭️  HEAD is already the release commit for $LATEST_TAG — idempotent, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "📦 Release needed — last tag '${LATEST_TAG:-none}', package.json ${PKG_VERSION}, channel ${CHANNEL}."

      - name: Set up Node
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release tooling
        if: steps.decide.outputs.release == 'true'
        run: npm ci

      - name: Bump the version from Conventional Commits
        if: steps.decide.outputs.release == 'true'
        env:
          CHANNEL: ${{ steps.decide.outputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            dev)        npm run version:dev ;;
            rc)         npm run version:staging ;;
            production) npm run version:production ;;
            *) echo "❌ Unknown channel '$CHANNEL'."; exit 1 ;;
          esac
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "🏷️  New version: v$VERSION"

      - name: Commit and push the release commit + annotated tag
        if: steps.decide.outputs.release == 'true'
        # WHY THE HOOK IS DISABLED HERE (regression guard — do not "tidy" this away):
        # `.husky/pre-push` runs the FULL test suite whenever the target branch is
        # master. The release bot pushes `HEAD:master`, so the hook fired inside CI
        # and the push step sat in_progress for 10+ minutes on a version bump
        # (run 35450947888, 2026-09-19) — the release looked hung, not failed.
        # This commit is mechanical (package.json / package-lock.json / CHANGELOG.md)
        # and is validated by the ci.yml run requested in the next step, which is
        # also what staging/production gate on. Pushing must also never block on an
        # interactive prompt, hence the non-interactive env.
        env:
          HUSKY: '0'
          GIT_TERMINAL_PROMPT: '0'
          GIT_EDITOR: 'true'
        run: |
          set -euo pipefail
          git config user.name 'anchor-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git commit --no-verify -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          for attempt in 1 2 3; do
            if git push --no-verify origin HEAD:master && git push --no-verify origin "refs/tags/$TAG"; then
              echo "✅ Pushed $TAG at $(git rev-parse HEAD)"
              exit 0
            fi
            echo "↻ push rejected (attempt $attempt) — re-applying onto the new master tip and retrying"
            git fetch origin master --tags --force
            if ! git rebase origin/master; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "❌ Rebase onto origin/master conflicted. Not guessing at a release commit."
              exit 1
            fi
          done
          echo "❌ Could not push the release commit after 3 attempts."
          exit 1

      - name: Request CI validation for the release commit
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if gh workflow run ci.yml --ref master; then
              echo "✅ Requested CI for the release commit $(git rev-parse HEAD)"
              echo "### 🏷️ Released \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
              echo "CI was requested for the release commit so it can be deployed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Could not request CI for the release commit."
          exit 1

      - name: Publish the GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.decide.outputs.channel }}
        run: |
          set -euo pipefail
          EXTRA=''
          if [ "$CHANNEL" != "production" ]; then
            EXTRA='--prerelease'
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$(git rev-parse HEAD)" $EXTRA
          echo "✅ GitHub Release $TAG published (channel: $CHANNEL)."

