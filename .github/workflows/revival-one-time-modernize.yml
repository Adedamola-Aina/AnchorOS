name: Revival One-Time Modernize

on:
  push:
    branches:
      - revival/sept-2026-hardening

permissions:
  contents: write

jobs:
  modernize:
    if: ${{ !contains(github.event.head_commit.message, '[modernized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revival/sept-2026-hardening
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply deterministic maintenance edits
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in [
              '.github/workflows/merge-gate.yml',
              '.github/workflows/weekly-health.yml',
              '.github/workflows/staging-deploy.yml',
              'docs/TESTING_STRATEGY.md',
          ]:
              p = Path(name)
              text = p.read_text()
              text = text.replace("node-version: '20'", "node-version: '22'")
              p.write_text(text)

          p = Path('.github/workflows/ci-cd.yml')
          text = p.read_text().replace("NODE_VERSION: '20'", "NODE_VERSION: '22'")
          text = text.replace('git add package.json\n', 'git add package.json package-lock.json\n')
          p.write_text(text)

          p = Path('scripts/bump-version.sh')
          text = p.read_text()
          text = text.replace(
              'git add package.json CHANGELOG.md 2>/dev/null || git add package.json',
              'git add package.json package-lock.json CHANGELOG.md 2>/dev/null || git add package.json package-lock.json'
          )
          p.write_text(text)

          p = Path('src/services/__tests__/FinanceService.integration.test.tsx')
          text = p.read_text()
          old = '''        // Load Firestore rules\n        let rules: string;\n        try {\n            rules = readFileSync(resolve(__dirname, '../../../config/firestore.rules'), 'utf-8');\n        } catch {\n            console.log('Could not load firestore.rules, using permissive rules for testing');\n            rules = `rules_version = '2'; service cloud.firestore { match /{document=**} { allow read, write: if true; } }`;\n        }\n'''
          new = '''        // Load the real Firestore rules. Security tests must fail closed if\n        // the rules file is missing instead of silently switching to allow-all.\n        const rules = readFileSync(resolve(__dirname, '../../../config/firestore.rules'), 'utf-8');\n'''
          if old not in text:
              raise SystemExit('expected permissive Firestore fallback block not found')
          p.write_text(text.replace(old, new))

          Path('.github/workflows/revival-one-time-modernize.yml').unlink()
          PY
      - name: Commit modernization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(revival): modernize CI and fail security tests closed [modernized]"
          git push origin HEAD:revival/sept-2026-hardening
