# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# The Checkmarx One GitHub Action enables you to trigger SAST, SCA, and KICS scans directly from the GitHub workflow.
# It provides a wrapper around the Checkmarx One CLI Tool which creates a zip archive from your source code repository
# and uploads it to Checkmarx One for scanning. The Github Action provides easy integration with GitHub while enabling
# scan customization using the full functionality and flexibility of the CLI tool.

# This is a basic workflow to help you get started with Using Checkmarx One Action,
# documentation can be found here : https://checkmarx.com/resource/documents/en/34965-68702-checkmarx-one-github-actions.html

name: Checkmarx Scan

# Controls when the workflow will run
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [ "master" ]

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.evaluate.outputs.enabled }}
      reason: ${{ steps.evaluate.outputs.reason }}
    steps:
      - name: Evaluate Checkmarx policy gate
        id: evaluate
        env:
          CHECKMARX_ENABLED: ${{ vars.CHECKMARX_ENABLED }}
          CX_CLIENT_ID: ${{ secrets.CX_CLIENT_ID }}
          CX_CLIENT_SECRET: ${{ secrets.CX_CLIENT_SECRET }}
          CX_TENANT: ${{ secrets.CX_TENANT }}
        run: |
          set -e
          if [[ "${CHECKMARX_ENABLED}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=disabled-by-variable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [[ -z "${CX_CLIENT_ID}" ]] && missing="${missing} CX_CLIENT_ID"
          [[ -z "${CX_CLIENT_SECRET}" ]] && missing="${missing} CX_CLIENT_SECRET"
          [[ -z "${CX_TENANT}" ]] && missing="${missing} CX_TENANT"

          if [[ -n "${missing}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets:${missing# }" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "reason=ready" >> "$GITHUB_OUTPUT"

  # This workflow contains a single job called "build"
  build:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # This step checks out a copy of your repository.
      - name: Checkout repository
        uses: actions/checkout@v4
      # This step creates the Checkmarx One scan
      - name: Checkmarx One scan
        uses: checkmarx/ast-github-action@8e887bb93dacc44e0f5b64ee2b06d5815f89d4fc
        with:
          base_uri: https://ast.checkmarx.net
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          cx_tenant: ${{ secrets.CX_TENANT }}
          additional_params: --report-format sarif --output-path .
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: cx_result.sarif

  skipped:
    needs: preflight
    if: needs.preflight.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report Checkmarx skip reason
        run: |
          echo "Checkmarx scan skipped: ${{ needs.preflight.outputs.reason }}"
          echo "Set repository variable CHECKMARX_ENABLED=true and configure CX_CLIENT_ID/CX_CLIENT_SECRET/CX_TENANT secrets to enable scanning."
