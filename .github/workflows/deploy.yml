name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      confirm:
        description: Type "deploy" to confirm a production deploy
        required: false
        default: ''

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Require confirmation for production
        if: ${{ inputs.environment == 'production' && inputs.confirm != 'deploy' }}
        run: |
          echo "Refusing production deploy: set confirm to \"deploy\"."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm install -g firebase-tools

      - name: Write environment files from secrets
        env:
          STAGING_FRONTEND_ENV: ${{ secrets.STAGING_FRONTEND_ENV }}
          STAGING_FUNCTIONS_ENV: ${{ secrets.STAGING_FUNCTIONS_ENV }}
          PRODUCTION_FRONTEND_ENV: ${{ secrets.PRODUCTION_FRONTEND_ENV }}
          PRODUCTION_FUNCTIONS_ENV: ${{ secrets.PRODUCTION_FUNCTIONS_ENV }}
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            printf '%s\n' "$PRODUCTION_FRONTEND_ENV" > .env.production
            printf '%s\n' "$PRODUCTION_FUNCTIONS_ENV" > functions/.env.anchor-os
          else
            printf '%s\n' "$STAGING_FRONTEND_ENV" > .env.staging
            printf '%s\n' "$STAGING_FUNCTIONS_ENV" > functions/.env.anchor-os-staging
          fi

      - name: Build and deploy
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./scripts/deploy.sh --env=${{ inputs.environment }} --yes
