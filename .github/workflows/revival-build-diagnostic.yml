name: Revival Build Diagnostic

on:
  push:
    branches:
      - revival/sept-2026-hardening

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build with diagnostics
        run: npm run build
