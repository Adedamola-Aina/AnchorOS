name: AnchorOSNative
options:
  bundleIdPrefix: com.anchoros
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.12.0
targets:
  AnchorOSNative:
    type: application
    platform: iOS
    sources:
      - path: AnchorOSNative
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anchoros.native
        INFOPLIST_FILE: AnchorOSNative/Resources/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
