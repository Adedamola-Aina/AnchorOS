<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anchor OS | Premium Shared Finance</title>
  <meta name="description"
    content="Manage shared finances, track family commitments, and build wealth with Anchor OS. The premium dashboard for modern households." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Anchor" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <script>
// @ts-nocheck

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=1.7.3').catch(err => console.log('SW reg failed:', err));
      });
    }
  
</script>
</head>

<body>
  <div id="boot-splash" aria-hidden="true" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:9999;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;opacity:.9;">
      <div style="width:44px;height:44px;border-radius:9999px;border:3px solid rgba(148,163,184,.25);border-top-color:#38bdf8;animation:anchor-spin .9s linear infinite"></div>
      <div style="font-size:12px;letter-spacing:.18em;text-transform:uppercase">Loading Anchor OS</div>
    </div>
  </div>
  <div id="root"></div>
  <style>
    @keyframes anchor-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="module" src="./src/main.tsx"></script>
  <script>
// @ts-nocheck

    // Critical Failsafe: Remove boot splash if app fails to remove it (race condition/error)
    setTimeout(() => {
      const splash = document.getElementById('boot-splash');
      if (splash) {
        console.warn('Anchor OS: Forced boot-splash removal (failsafe trigger)');
        splash.style.transition = 'opacity 0.5s ease-out';
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }
    }, 4000); 
  
</script>
</body>

</html>
